<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1688 訂單追蹤</title>
<style>
:root{
  --accent:#b5564e;
  --accent-soft:#b5564e14;
  --bg:#fff;
  --text:#222;
  --muted:#757575;
  --line:#eceae7;
  --soft:#f6f5f3;
  --ok:#2a8a3a;
  --ok-bg:#2a8a3a14;
  --warn:#a4744c;
  --warn-bg:#a4744c18;
  --bad:#b5564e;
  --bad-bg:#b5564e14;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --radius:12px;
  --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}
body{padding:20px 24px 48px}
.page{max-width:1120px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:22px;font-weight:650;letter-spacing:.02em;margin:0 0 4px}
.updated{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:10px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
.summaries{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.metric{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.metric b{display:block;font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.2;color:var(--text)}
.metric .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.metric.ok b{color:var(--ok)}
.metric.warn b{color:var(--warn)}
.metric.bad b{color:var(--bad)}
.progress{margin:0 0 20px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.bar span{display:block;height:100%;min-width:0}
.bar .s-arrived{background:var(--ok)}
.bar .s-transit{background:var(--warn)}
.bar .s-unshipped{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend .s-arrived{background:var(--ok)}
.legend .s-transit{background:var(--warn)}
.legend .s-unshipped{background:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.toolbar input[type=search],.toolbar select,.toolbar input[type=text]{
  font:inherit;border:1px solid #ddd;border-radius:8px;padding:7px 10px;background:#fff;color:var(--text);min-width:0
}
.toolbar input[type=search]{flex:1;min-width:200px}
.seg{display:flex;background:var(--soft);padding:3px;border-radius:8px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;cursor:pointer;color:#555}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:var(--shadow)}
button.btn{appearance:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
button.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:3px solid var(--line)}
.card.k-arrived,.card.k-arrived_unknown{border-left-color:var(--ok)}
.card.k-in_transit{border-left-color:var(--warn)}
.card.k-unshipped{border-left-color:var(--bad)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px;margin-bottom:6px}
.card-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
button.btn.btn-sm{padding:3px 10px;font-size:12px;font-weight:600;border-radius:6px}
.card-title{font-size:15px;font-weight:650;margin:0;line-height:1.4}
.card-title .code{color:var(--accent);margin-right:6px}
.card-meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card-meta a{color:var(--accent);text-decoration:none}
.card-meta a:hover{text-decoration:underline}
.dates{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 8px;font-size:13px}
.dates b{font-weight:650}
.track{font-size:12px;color:var(--muted);margin:0 0 10px;word-break:break-word}
.note{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;margin:0 0 10px}
.sku-list{list-style:none;margin:8px 0 0;padding:0;font-size:13px;line-height:1.7}
.sku-list li{display:flex;justify-content:flex-start;gap:16px;padding:0;font-variant-numeric:tabular-nums}
.sku-list .sku-price{color:var(--muted);margin-left:auto}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:650;line-height:1.6;border:1px solid transparent;vertical-align:middle}
.badge.arrived,.badge.arrived_unknown{background:var(--ok-bg);color:var(--ok)}
.badge.in_transit{background:var(--warn-bg);color:var(--warn)}
.badge.unshipped{background:var(--bad-bg);color:var(--bad)}
.badge.flag{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--soft);font-weight:650;position:sticky;top:0;z-index:1;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:650;background:var(--soft);border-bottom:0}
.sample-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.num-field{display:inline-flex;align-items:center;gap:6px}
.num-field label{font-size:12px;color:var(--muted)}
.num-field input{width:110px;border:1px solid #ddd;border-radius:8px;padding:6px 8px;font:inherit}
.file-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0 6px}
.state-seg{flex-wrap:wrap}
.memo-label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
textarea.memo{width:100%;min-height:56px;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;line-height:1.5;color:var(--text);background:#fff}
.maybe-box,.no-box,.done-box{margin-top:22px}
.maybe-box h3{font-size:14px;font-weight:650;margin:0 0 10px}
.done-box summary,.no-box summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--muted);margin:0 0 10px;list-style:none}
.done-box summary::-webkit-details-marker,.no-box summary::-webkit-details-marker{display:none}
.done-box summary::before,.no-box summary::before{content:"▸ ";}
.done-box[open] summary::before,.no-box[open] summary::before{content:"▾ "}
.card.is-done{opacity:.82}
.done-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.confirm-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:200}
.confirm-box{background:#fff;border-radius:12px;padding:20px 22px;max-width:380px;width:calc(100% - 40px);box-shadow:0 8px 28px rgba(0,0,0,.15)}
.confirm-box p{margin:0 0 16px;font-size:14px;line-height:1.6}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
.toast{position:fixed;right:16px;bottom:16px;background:#333;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;z-index:99;pointer-events:none;font-size:13px}
.toast.show{opacity:.95;transform:none}
.hidden{display:none !important}
@media(max-width:800px){
  body{padding:14px 14px 40px}
  .summaries{grid-template-columns:repeat(2,1fr)}
}
.sync{font-size:11px;color:var(--muted);margin-top:2px;min-height:15px}
.sync.bad{color:var(--warn)}
</style>
</head>

<div class="page">

    <div>
      <h1>1688 訂單追蹤</h1>
      <div class="updated" id="updated"></div>
      <div class="sync" id="sync-status"></div>
    </div>
    <div class="tabs" role="tablist">

      <button type="button" id="tab-sample" role="tab" aria-selected="false">樣品</button>
    </div>
  </header>

  <section class="summaries" id="metrics"></section>
  <div class="progress" id="progress"></div>

  <div id="panel-bulk">
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋貨號或商品名" autocomplete="off">
      <select id="status-filter" aria-label="狀態篩選">
        <option value="all">全部</option>
        <option value="arrived">已到貨</option>
        <option value="in_transit">運送中</option>
        <option value="unshipped">未發貨</option>
      </select>
      <div class="seg" role="group" aria-label="檢視方式">
        <button type="button" id="view-cards" class="on">商品卡片</button>
        <button type="button" id="view-table">盤點總表</button>
      </div>
      <button type="button" class="btn" id="copy-bulk">一鍵複製</button>
    </div>
    <div id="bulk-body"></div>
  </div>

  <div id="panel-sample" class="hidden">
    <div class="toolbar">
      <button type="button" class="btn" id="copy-archive">複製建檔清單</button>
      <button type="button" class="btn ghost" id="copy-sample">一鍵複製</button>
    </div>
    <div id="sample-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="confirm-mask" class="confirm-mask hidden">
  <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-msg">
    <p id="confirm-msg">確認將此訂單移到已完成？</p>
    <div class="confirm-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">取消</button>
      <button type="button" class="btn" id="confirm-ok">確定</button>
    </div>
  </div>
</div>

    var offer = btn.getAttribute("data-offer") || "";
    var order = btn.getAttribute("data-order") || "";
    var cat = btn.getAttribute("data-cat") || "";
    var list = (cat === "樣品" || cat === "样品") ? sampleRows : bulkRows;
    var rows;
    if (cat === "樣品" || cat === "样品") {
      rows = list.filter(function (r) {
        return String(r.offer_id) === offer && (!order || String(r.order_no) === order);
      });
    } else {
      rows = list.filter(function (r) { return String(r.offer_id) === offer; });
    }
    if (!rows.length) return null;
    return { rows: rows, first: rows[0] };
  }
  function bulkArchiveText(group) {
    var code = displayCode(group.first) || "（未填）";
    var specs = group.rows.map(function (r) {
      var parts = [];
      if (r.color) parts.push(r.color);
      if (r.size) parts.push(r.size);
      return (parts.join(" ") || "—") + " ×" + r.quantity;
    }).join("\n");
    return [
      "編號：" + code,
      "商品：" + (group.first.product_title || ""),
      "1688 連結：" + (group.first.product_url || ""),
      "顏色尺碼：",
      specs
    ].join("\n");
  }
  function receiveBtnHtml(group, done) {
    var ono = String(group.first.order_no);
    if (done) {
      return '<button type="button" class="btn ghost btn-sm" data-act="undo-done" data-order="' + esc(ono) + '">復原</button>';
    }
    return '<button type="button" class="btn ghost btn-sm" data-act="mark-done" data-order="' + esc(ono) + '">確認點收</button>';
  }
  function stateSegHtml(rec) {
    var cur = sampleDecision(rec);
    var opts = [["confirm", "確認進貨"], ["maybe", "猶豫"], ["no", "不要"]];
    return '<div class="seg state-seg" role="group">' + opts.map(function (o) {
      return '<button type="button" data-act="state" data-state="' + o[0] + '"' +
        (cur === o[0] ? ' class="on"' : "") + ">" + o[1] + "</button>";
    }).join("") + "</div>";
  }

  function archiveText(groups, saved) {
    var picked = groups.filter(function (g) { return sampleDecision(saved[g.key] || {}) === "confirm"; });
    if (!picked.length) return "";
    var blocks = picked.map(function (g) {
      var st = saved[g.key] || {};
      var code = (st.code || "").trim() || "（未填）";
      var specs = g.rows.map(function (r) {
        var sp = r.size ? r.color + "／" + r.size : dash(r.color);
        var price = r.unit_price ? "　單價 ¥" + r.unit_price : "";
        return sp + " ×" + r.quantity + price;
      }).join("\n");
      return [
        "編號：" + code,
        "商品：" + (g.first.product_title || ""),
        "顏色尺碼：",
        specs,
        "1688 連結：" + (g.first.product_url || "")
      ].join("\n");
    });
    return "【建檔清單】共 " + picked.length + " 款\n\n" + blocks.join("\n\n");
  }

  function renderUpdated() {
    var t = DATA.updated_at || "";
    document.getElementById("updated").textContent = t
      ? "資料更新時間 " + t + "（台北時間）"
      : "";
  }

  function doneNote(list) {
    var d = completedOf(list);
    if (!d.length) return "";
    var nOrd = uniqueCount(d, function (r) { return r.order_no; });
    var q = qtyOf(d, function () { return true; });
    return '<div class="done-note">已完成 ' + nOrd + " 筆、" + q + " 件，不列入上方統計</div>";
  }
  function renderMetrics() {
    var html, bar, note;
    if (state.tab === "bulk") {
      var list = activeOf(bulkRows);
      note = doneNote(bulkRows);
      var total = qtyOf(list, function () { return true; });
      var arrived = qtyOf(list, function (r) { return isArrived(r.delivery_kind); });
      var transit = qtyOf(list, function (r) { return r.delivery_kind === "in_transit"; });
      var unship = qtyOf(list, function (r) { return r.delivery_kind === "unshipped"; });
      html =
        metric("總件數", total, "") +
        metric("已到貨", arrived, "ok") +
        metric("運送中", transit, "warn") +
        metric("未發貨", unship, "bad");
      bar = progressBar(arrived, transit, unship, total);
    } else {
      var sampleActive = activeOf(sampleRows);
      var groups = groupSamples(sampleActive);
      var archived = groups.filter(function (g) { return !!(g.first.product_code); }).length;
      var styles = groups.length;
      var arrivedS = qtyOf(sampleActive, function (r) { return isArrived(r.delivery_kind); });
      var transitS = qtyOf(sampleActive, function (r) { return r.delivery_kind === "in_transit"; });
      var unshipS = qtyOf(sampleActive, function (r) { return r.delivery_kind === "unshipped"; });
      note = doneNote(sampleRows);
      var qty = arrivedS + transitS + unshipS;
      html =
        metric("樣品款數", styles, "") +
        metric("已建檔", archived, "ok") +
        metric("未建檔", styles - archived, "warn") +
        metric("樣品件數", qty, "");
      bar = progressBar(arrivedS, transitS, unshipS, qty);
    }
    document.getElementById("metrics").innerHTML = html;
    document.getElementById("progress").innerHTML = bar + (note || "");
  }
  function metric(label, value, tone) {
    var cls = (tone && value) ? tone : "";
    return '<div class="metric ' + esc(cls) + '"><b>' + esc(String(value)) + '</b><div class="lbl">' + esc(label) + "</div></div>";
  }
  function progressBar(arrived, transit, unship, total) {
    total = total || 0;
    function w(n) { return total ? ((n / total) * 100).toFixed(2) + "%" : "0%"; }
    return (
      '<div class="bar">' +
        (arrived ? '<span class="s-arrived" style="width:' + w(arrived) + '"></span>' : "") +
        (transit ? '<span class="s-transit" style="width:' + w(transit) + '"></span>' : "") +
        (unship ? '<span class="s-unshipped" style="width:' + w(unship) + '"></span>' : "") +
      "</div>" +
      '<div class="legend">' +
        '<span><i class="s-arrived"></i>已到貨 ' + arrived + " 件</span>" +
        '<span><i class="s-transit"></i>運送中 ' + transit + " 件</span>" +
        '<span><i class="s-unshipped"></i>未發貨 ' + unship + " 件</span>" +
      "</div>"
    );
  }

  function datesHtml(row) {
    var ship = row.ship_label || "未發貨";
    var deliv = deliveryText(row);
    return (
      '<div class="dates">' +
        "<div>發貨 <b>" + esc(ship) + "</b></div>" +
        '<div>送達 <span class="' + badgeClass(row.delivery_kind) + '">' + esc(deliv) + "</span></div>" +
      "</div>"
    );
  }
  function trackHtml(row) {
    var parts = [];
    if (row.carrier) parts.push(row.carrier);
    if (row.tracking_no) parts.push(row.tracking_no);
    if (row.latest_tracking) parts.push(row.latest_tracking);
    if (!parts.length) return "";
    return '<div class="track">' + esc(parts.join("｜")) + "</div>";
  }
  function mismatchHtml(row) {
    var m = mismatchMap[row.order_no];
    if (!m || !(m.difference > 20)) return "";
    return '<div class="note">此訂單金額（¥' + esc(String(m.order_total)) + "）高於已列品項加總，可能還有未抓到的品項，請以本頁件數為準。</div>";
  }
  function skuLine(row) {
    var parts = [];
    if (row.color) parts.push(row.color);
    if (row.size) parts.push(row.size);
    return (parts.join(" ") || "—") + " ×" + row.quantity;
  }
  function skuListHtml(list, withPrice) {
    return (
      '<ul class="sku-list">' +
      list.map(function (r) {
        var price = (withPrice && r.unit_price) ? '<span class="sku-price">¥' + esc(r.unit_price) + "</span>" : "";
        return "<li><span>" + esc(skuLine(r)) + "</span>" + price + "</li>";
      }).join("") +
      "</ul>"
    );
  }

  function productCard(g, done) {
    var r = g.first;
    var sysCode = (r.product_code || "").trim();
    var typed = enteredBulkCode(r.offer_id);
    var code = sysCode || typed;
    var flag = r.conflict ? ' <span class="badge flag">待確認</span>' : "";
    var fileRow = sysCode ? "" : (
      '<div class="file-actions">' +
        '<span class="num-field"><label>輸入編號</label><input type="text" data-act="bulk-code" data-offer="' +
          esc(String(r.offer_id)) + '" value="' + esc(typed) + '" placeholder="輸入貨號" autocomplete="off"></span>' +
        '<button type="button" class="btn ghost btn-sm" data-act="copy-bulk-archive" data-offer="' +
          esc(String(r.offer_id)) + '" data-cat="' + esc(r.category || "") + '">複製建檔清單</button>' +
      "</div>"
    );
    return (
      '<article class="' + cardClass(g.kind) + (done ? " is-done" : "") + '" data-offer="' + esc(String(r.offer_id)) + '">' +
        '<div class="card-head">' +
          '<h2 class="card-title">' +
            (code ? '<span class="code">' + esc(code) + "</span>" : "") +
            esc(r.product_title || r.short_name || "") + flag +
          "</h2>" +
          '<div class="card-head-right">' +
            '<span class="' + badgeClass(g.kind) + '">' + esc(deliveryText(r)) + " · " + g.qty + " 件</span>" +
            copyBtnHtml(g) +
            receiveBtnHtml(g, done) +
          "</div>" +
        "</div>" +
        fileRow +
        '<div class="card-meta">' +
          "<span>" + esc(r.seller || "") + "</span>" +
          (r.product_url ? '<a href="' + esc(r.product_url) + '" target="_blank" rel="noopener noreferrer">1688 連結</a>' : "") +
        "</div>" +
        datesHtml(r) +
        trackHtml(r) +
        mismatchHtml(r) +
        skuListHtml(g.rows, false) +
      "</article>"
    );
  }

  function inventoryTable(list) {
    var map = {};
    var order = [];
    list.forEach(function (r) {
      var k = [r.product_url || r.offer_id, r.color, r.size].join("||");
      if (!map[k]) {
        map[k] = {
          code: r.product_code || "",
          title: r.product_title || r.short_name || "",
          color: r.color || "",
          size: r.size || "",
          arrived: 0,
          pending: 0
        };
        order.push(k);
      }
      if (isArrived(r.delivery_kind)) map[k].arrived += r.quantity || 0;
      else map[k].pending += r.quantity || 0;
    });
    var arrived = 0, pending = 0;
    var body = order.map(function (k) {
      var a = map[k];
      var t = a.arrived + a.pending;
      arrived += a.arrived;
      pending += a.pending;
      return (
        "<tr>" +
          "<td>" + esc(dash(a.code)) + "</td>" +
          "<td>" + esc(a.title) + "</td>" +
          "<td>" + esc(dash(a.color)) + "</td>" +
          "<td>" + esc(dash(a.size)) + "</td>" +
          '<td class="n">' + a.arrived + "</td>" +
          '<td class="n">' + a.pending + "</td>" +
          '<td class="n">' + t + "</td>" +
        "</tr>"
      );
    }).join("");
    body +=
      '<tr class="total"><td></td><td>合計</td><td></td><td></td>' +
      '<td class="n">' + arrived + '</td><td class="n">' + pending + '</td><td class="n">' + (arrived + pending) + "</td></tr>";
    return (
      '<div class="wrap"><table>' +
        "<thead><tr><th>貨號</th><th>商品</th><th>顏色</th><th>尺碼</th>" +
        '<th class="n">已到</th><th class="n">在途</th><th class="n">合計</th></tr></thead>' +
        "<tbody>" + body + "</tbody></table></div>"
    );
  }

  function doneSectionHtml(rows, kind) {
    if (!rows.length) return "";
    var qty = qtyOf(rows, function () { return true; });
    var nOrd = uniqueCount(rows, function (r) { return r.order_no; });
    var cards;
    if (kind === "sample") {
      var saved = loadSampleState();
      cards = groupSamples(rows).map(function (g) { return sampleCardHtml(g, saved, true, "full"); }).join("");
    } else {
      cards = groupByProduct(rows).map(function (g) { return productCard(g, true); }).join("");
    }
    return '<details class="done-box"><summary>已完成（' + nOrd + " 筆／" + qty + " 件）</summary><div class=\"cards\">" + cards + "</div></details>";
  }
  function renderBulk() {
    var list = filteredBulk();
    var el = document.getElementById("bulk-body");
    var body;
    if (state.view === "table") {
      body = list.length ? inventoryTable(list) : '<div class="empty">沒有符合條件的大貨。</div>';
    } else if (!list.length) {
      body = '<div class="empty">沒有符合條件的大貨。</div>';
    } else {
      body = '<div class="cards">' + groupByProduct(list).map(function (g) { return productCard(g, false); }).join("") + "</div>";
    }
    var done = completedOf(bulkRows).filter(function (r) { return matchesQuery(r, state.q.trim()); });
    el.innerHTML = body + doneSectionHtml(done, "bulk");
  }

  function sampleCardHtml(g, saved, done, variant) {
    var r = g.first;
    var rec = saved[g.key] || {};
    var code = rec.code != null ? rec.code : (r.product_code || "");
    var decision = sampleDecision(rec);
    var archived = !!(r.product_code);
    var memo = rec.memo || "";
    var compact = variant === "maybe" || variant === "no";
    var num = (!compact && decision !== "no")
      ? '<span class="num-field"><label>編號</label><input type="text" data-act="code" value="' + esc(code) + '" placeholder="輸入貨號" autocomplete="off"></span>' +
        (archived ? '<span class="badge ok">已建檔</span>' : "") +
        (r.conflict ? '<span class="badge flag">待確認</span>' : "")
      : "";
    var memoBox = (variant === "maybe")
      ? '<label class="memo-label">備忘錄</label><textarea class="memo" data-act="memo" rows="2" placeholder="例如：價格偏高、等秋冬再看">' + esc(memo) + "</textarea>"
      : "";
    var details = compact
      ? ""
      : (datesHtml(r) + trackHtml(r) + skuListHtml(g.rows, true));
    return (
      '<article class="' + cardClass(r.delivery_kind) + (done ? " is-done" : "") + '" data-key="' + esc(g.key) + '">' +
        (compact ? "" : '<div class="sample-actions">' + stateSegHtml(rec) + num + "</div>") +
        '<div class="card-head">' +
          '<h2 class="card-title">' +
            (r.product_code ? '<span class="code">' + esc(r.product_code) + "</span>" : "") +
            esc(r.product_title || "") +
          "</h2>" +
          '<div class="card-head-right">' + copyBtnHtml(g) + receiveBtnHtml(g, done) + "</div>" +
        "</div>" +
        (compact ? '<div class="sample-actions">' + stateSegHtml(rec) + "</div>" : "") +
        '<div class="card-meta">' +
          "<span>" + esc(r.seller || "") + "</span>" +
          (r.product_url ? '<a href="' + esc(r.product_url) + '" target="_blank" rel="noopener noreferrer">1688 連結</a>' : "") +
        "</div>" +
        details +
        memoBox +
      "</article>"
    );
  }
  function renderSamples() {
    var saved = loadSampleState();
    var el = document.getElementById("sample-body");
    var active = activeOf(sampleRows);
    var done = completedOf(sampleRows);
    var groups = groupSamples(active);
    var main = [], maybe = [], no = [];
    groups.forEach(function (g) {
      var d = sampleDecision(saved[g.key] || {});
      if (d === "maybe") maybe.push(g);
      else if (d === "no") no.push(g);
      else main.push(g);
    });
    var html = "";
    if (main.length) {
      html += '<div class="cards">' + main.map(function (g) { return sampleCardHtml(g, saved, false, "full"); }).join("") + "</div>";
    }
    if (maybe.length) {
      html += '<section class="maybe-box"><h3>猶豫清單（' + maybe.length + " 款）</h3><div class=\"cards\">" +
        maybe.map(function (g) { return sampleCardHtml(g, saved, false, "maybe"); }).join("") + "</div></section>";
    }
    if (no.length) {
      html += '<details class="no-box"><summary>不要（' + no.length + " 款）</summary><div class=\"cards\">" +
        no.map(function (g) { return sampleCardHtml(g, saved, false, "no"); }).join("") + "</div></details>";
    }
    html += doneSectionHtml(done, "sample");
    if (!main.length && !maybe.length && !no.length && !done.length) {
      html = '<div class="empty">目前沒有樣品。</div>';
    }
    el.innerHTML = html;
  }

  function updateTabs() {
    var bulk = state.tab === "bulk";
    document.getElementById("tab-bulk").setAttribute("aria-selected", bulk ? "true" : "false");
    document.getElementById("tab-sample").setAttribute("aria-selected", bulk ? "false" : "true");
    document.getElementById("panel-bulk").classList.toggle("hidden", !bulk);
    document.getElementById("panel-sample").classList.toggle("hidden", bulk);
    var nBulk = uniqueCount(activeOf(bulkRows), productKey);
    var nSamp = groupSamples(activeOf(sampleRows)).length;
    document.getElementById("tab-bulk").textContent = "大貨（" + nBulk + "）";
    document.getElementById("tab-sample").textContent = "樣品（" + nSamp + "）";
  }

  function render() {
    updateTabs();
    renderMetrics();
    if (state.tab === "bulk") renderBulk();
    else renderSamples();
  }

  document.getElementById("tab-bulk").addEventListener("click", function () { state.tab = "bulk"; render(); });
  document.getElementById("tab-sample").addEventListener("click", function () { state.tab = "sample"; render(); });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; renderBulk(); });
  document.getElementById("status-filter").addEventListener("change", function (e) { state.status = e.target.value; renderBulk(); });
  document.getElementById("view-cards").addEventListener("click", function () {
    state.view = "cards";
    document.getElementById("view-cards").classList.add("on");
    document.getElementById("view-table").classList.remove("on");
    renderBulk();
  });
  document.getElementById("view-table").addEventListener("click", function () {
    state.view = "table";
    document.getElementById("view-table").classList.add("on");
    document.getElementById("view-cards").classList.remove("on");
    renderBulk();
  });
  var pendingOrder = null;
  function openConfirm(orderNo) {
    pendingOrder = String(orderNo);
    var all = rows.filter(function (r) { return String(r.order_no) === pendingOrder; });
    var n = uniqueCount(all, productKey);
    var q = qtyOf(all, function () { return true; });
    var tail = pendingOrder.slice(-9);
    document.getElementById("confirm-msg").textContent =
      "確認將訂單尾號 " + tail + " 點收，並移到已完成？（" + n + " 款、" + q + " 件）";
    document.getElementById("confirm-mask").classList.remove("hidden");
  }
  function closeConfirm() {
    pendingOrder = null;
    document.getElementById("confirm-mask").classList.add("hidden");
  }
  document.getElementById("confirm-ok").addEventListener("click", function () {
    if (pendingOrder) markDone(pendingOrder);
    closeConfirm();
    render();
  });
  document.getElementById("confirm-cancel").addEventListener("click", closeConfirm);
  document.getElementById("confirm-mask").addEventListener("click", function (e) {
    if (e.target.id === "confirm-mask") closeConfirm();
  });
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    if (act === "copy-card") {
      e.preventDefault();
      var g = groupFromBtn(btn);
      if (g) copyText(skuCopyText(g));
      return;
    }
    if (act === "copy-bulk-archive") {
      e.preventDefault();
      var g = groupFromBtn(btn);
      if (!g) return;
      if (!displayCode(g.first)) { toast("請先輸入編號"); return; }
      copyText(bulkArchiveText(g));
      return;
    }
    if (act === "mark-done") {
      e.preventDefault();
      openConfirm(btn.getAttribute("data-order"));
      return;
    }
    if (act === "undo-done") {
      e.preventDefault();
      unmarkDone(btn.getAttribute("data-order"));
      render();
      return;
    }
    if (act === "state") {
      e.preventDefault();
      var card = btn.closest("[data-key]");
      if (!card) return;
      var key = card.getAttribute("data-key");
      var saved = loadSampleState();
      if (!saved[key]) saved[key] = {};
      saved[key].state = btn.getAttribute("data-state") || "";
      saved[key].checked = saved[key].state === "confirm";
      var codeInput = card.querySelector('[data-act="code"]');
      var memoInput = card.querySelector('[data-act="memo"]');
      if (codeInput) saved[key].code = codeInput.value;
      if (memoInput) saved[key].memo = memoInput.value;
      saveSampleState(saved);
      render();
    }
  });
  document.getElementById("copy-bulk").addEventListener("click", function () {
    copyText(productsCopy(groupByProduct(filteredBulk())));
  });
  document.getElementById("copy-sample").addEventListener("click", function () {
    copyText(productsCopy(groupByProduct(activeOf(sampleRows))));
  });
  document.getElementById("copy-archive").addEventListener("click", function () {
    var text = archiveText(groupSamples(activeOf(sampleRows)), loadSampleState());
    if (!text) { toast("請先將要進貨的樣品設為確認進貨"); return; }
    copyText(text);
  });
  document.getElementById("bulk-body").addEventListener("input", function (e) {
    var el = e.target;
    if (el.getAttribute("data-act") !== "bulk-code") return;
    var offer = el.getAttribute("data-offer") || "";
    var map = loadBulkCodes();
    map[String(offer)] = el.value;
    saveBulkCodes(map);
  });
  document.getElementById("sample-body").addEventListener("input", function (e) {
    var el = e.target;
    var act = el.getAttribute("data-act");
    if (act !== "code" && act !== "memo") return;
    var card = el.closest("[data-key]");
    if (!card) return;
    var key = card.getAttribute("data-key");
    var saved = loadSampleState();
    if (!saved[key]) saved[key] = {};
    if (act === "code") saved[key].code = el.value;
    if (act === "memo") saved[key].memo = el.value;
    saveSampleState(saved);
  });

  renderUpdated();
  render();
  cloudInit();
})();
</script>
</body>
</html>
