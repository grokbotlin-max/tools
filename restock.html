<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>補貨盤點</title><style>
:root{--red:#e03131;--red2:#fff0f0;--ink:#222;--mut:#888;--bd:#e6e6ea;--g:#2b8a3e;--b:#1c7ed6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f6f8;color:var(--ink)}
header{background:#fff;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{margin:0 0 12px;font-size:22px}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.card b{display:block;font-size:24px}.card span{font-size:13px;color:var(--mut)}
.card.u{background:var(--red);color:#fff;border:0}.card.u span{color:#ffe3e3}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tab{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font-size:15px;cursor:pointer}
.tab.on{background:#222;color:#fff;border-color:#222}.tab.u.on{background:var(--red);border-color:var(--red)}
#q{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--bd);border-radius:20px;font-size:15px}
main{padding:16px 20px;max-width:1200px;margin:auto}
.grp{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:14px;overflow:hidden}
.grp.urgent{border:2px solid var(--red)}.grp.urgent .gh{background:var(--red2)}
.gh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
.gh h2{margin:0;font-size:18px}.gh small{color:var(--mut);font-weight:normal;margin-left:6px}.tot{font-weight:700}
.olink{font-size:14px;font-weight:600;color:#1565C0;text-decoration:none;margin-left:10px;padding:2px 8px;background:#E3F2FD;border-radius:6px}.pnote{font-size:12px;color:#5D4E37;margin-left:8px;font-weight:normal}
.row{display:grid;grid-template-columns:170px 1fr 90px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f2}
.row:last-child{border:0}.row.done{opacity:.4}.cs{font-weight:600}.cs .tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;font-size:12px;padding:1px 6px;margin-left:6px}
.skip .cs .tag{background:#999}.st{font-size:13px;color:#555;line-height:1.6}.st em{font-style:normal;color:var(--red);font-weight:600}
.qty{font-size:22px;font-weight:700;text-align:center}.qty small{display:block;font-size:11px;color:var(--mut);font-weight:normal}
.btns{display:flex;gap:6px;flex-wrap:wrap}.bt{flex:1;border:2px solid var(--bd);background:#fff;border-radius:10px;padding:8px 4px;font-size:14px;cursor:pointer;min-width:84px}
.bt.on.r{background:var(--g);border-color:var(--g);color:#fff}.bt.on.d{background:#555;border-color:#555;color:#fff}.bt.on.n{background:var(--b);border-color:var(--b);color:#fff}
.gb{padding:10px 14px;border-bottom:1px solid var(--bd);background:#fafafb;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.gb .btns{flex:1;max-width:520px}.gb .dt{width:auto;margin:0}.ms{font-size:12px;color:var(--g);font-weight:600}
.dt{width:100%;margin-top:4px;font-size:13px;padding:4px;border:1px solid var(--bd);border-radius:6px}
.empty{text-align:center;color:var(--mut);padding:40px}#msg{position:fixed;bottom:16px;right:16px;background:#222;color:#fff;padding:8px 14px;border-radius:8px;display:none}
@media(max-width:760px){.sum{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 70px}.row .st{grid-column:1/3}.gb .btns{max-width:none}header{position:static}}
</style></head><body>
<header><h1>📦 補貨盤點</h1><div class="sum" id="sum"></div>
<div class="bar"><button class="tab u on" data-t="urgent">🔴 急件</button><button class="tab" data-t="normal">一般</button><button class="tab" data-t="skip">建議不補貨</button><button class="tab" data-t="done">已處理</button><button class="tab" data-t="all">全部</button><input id="q" placeholder="搜尋款號，例如 M486"></div></header>
<main id="list"><div class="empty">載入中…</div></main><div id="msg"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,doc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyD1JbLbRzCoJe7y0x1bQejyYcyoupr5vM",authDomain:"amore-rma.firebaseapp.com",projectId:"amore-rma",storageBucket:"amore-rma.firebasestorage.app",messagingSenderId:"390489542448",appId:"1:390489542448:web:75eb321efed739e089c2f5"}));
let items=[],marks={},tab="urgent",q="";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const done=s=>{const m=marks[s]||{};return m.received||m.discontinued||m.noRestock};
const toast=t=>{const e=document.getElementById("msg");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1800)};
let plinks={};
async function loadLinks(){try{const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndicGFqaHFzcG95aXp5bmRscWhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDAzNjUsImV4cCI6MjA4NzA3NjM2NX0.sKGVUGkR00UpcaUNPCLq8YOsXfrojII_b28I_XO4JuI";const r=await fetch("https://wbpajhqspoyizyndlqhr.supabase.co/rest/v1/products?select=id,url,notes",{headers:{apikey:K,Authorization:"Bearer "+K}});(await r.json()).forEach(p=>plinks[String(p.id).trim().toUpperCase()]=p)}catch(e){console.warn("links",e)}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function linkHtml(s){const p=plinks[String(s).toUpperCase()];if(!p)return"";let h="";if(p.url&&/^https?:/.test(p.url))h+=`<a class="olink" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 叫貨連結</a>`;if(p.notes&&p.notes.trim())h+=`<span class="pnote">📝 ${esc(p.notes.trim())}</span>`;return h}
async function load(){
 const[a,b]=await Promise.all([getDocs(collection(db,"restock_items")),getDocs(collection(db,"restock_marks")),loadLinks()]);
 items=a.docs.map(d=>d.data()).sort((x,y)=>x.order-y.order);b.docs.forEach(d=>marks[d.id]=d.data());render();}
function summary(){
 const act=items.filter(i=>!done(i.sku)&&i.level!=="skip"),u=act.filter(i=>i.level==="urgent");
 const st=new Set(act.map(i=>i.style)),cd=items[0]?.checkDate||"";
 document.getElementById("sum").innerHTML=`<div class="card u"><b>${u.length}</b><span>急件（${new Set(u.map(i=>i.style)).size} 款 ${u.reduce((s,i)=>s+i.suggestQty,0)} 件）</span></div>
 <div class="card"><b>${st.size} 款 / ${act.reduce((s,i)=>s+i.suggestQty,0)} 件</b><span>待補貨</span></div>
 <div class="card"><b>${items.filter(i=>i.level==="skip"&&!done(i.sku)).length}</b><span>建議不補貨（未確認）</span></div>
 <div class="card"><b>${cd}</b><span>盤點日期 · 已處理 ${items.filter(i=>done(i.sku)).length} 列</span></div>`;}
function render(){
 summary();const L={urgent:"急",normal:"一般",skip:"建議不補貨"};
 let rows=items.filter(i=>tab==="all"?true:tab==="done"?done(i.sku):(i.level===tab&&!done(i.sku)));
 if(q)rows=rows.filter(i=>(i.sku+i.name).toUpperCase().includes(q));
 if(!rows.length){document.getElementById("list").innerHTML='<div class="empty">沒有項目 🎉</div>';return}
 const g=new Map();rows.forEach(i=>{if(!g.has(i.style))g.set(i.style,[]);g.get(i.style).push(i)});
 document.getElementById("list").innerHTML=[...g].map(([s,a])=>{const u=a.some(i=>i.level==="urgent"&&!done(i.sku));
 return`<section class="grp ${u?"urgent":""}"><div class="gh"><h2>${u?"🔴 ":""}${s}<small>${a[0].name}</small>${linkHtml(s)}</h2><span class="tot">小計 ${a.reduce((x,i)=>x+i.suggestQty,0)} 件 · ${a.length} 列</span></div>`+
`<div class="gb">${(()=>{const sk=skus(s),on=k=>sk.every(x=>(marks[x]||{})[k]),dd=(sk.map(x=>(marks[x]||{}).receivedDate).find(Boolean))||"";
 return`<div class="btns"><button class="bt r ${on("received")?"on":""}" data-g="${s}" data-k="received">✔ 已進貨</button><button class="bt d ${on("discontinued")?"on":""}" data-g="${s}" data-k="discontinued">⛔ 停產</button><button class="bt n ${on("noRestock")?"on":""}" data-g="${s}" data-k="noRestock">✖ 確定不補貨</button></div>${on("received")?`<span class="ms">已進貨</span><input type="date" class="dt" data-g="${s}" value="${dd}">`:""}`})()}</div>`+
 a.map(i=>{const m=marks[i.sku]||{};const st=m.received?"✔ 已進貨"+(m.receivedDate?" "+m.receivedDate.slice(5):""):m.discontinued?"⛔ 停產":m.noRestock?"✖ 不補貨":"";return`<div class="row ${i.level} ${done(i.sku)?"done":""}"><div class="cs">${i.color} ${i.size}<span class="tag">${L[i.level]}</span><div style="font-size:12px;color:#999;font-weight:normal">${i.sku}${st?` · <span class="ms">${st}</span>`:""}</div></div>
 <div class="st">庫存 <b>${i.stock}</b> ｜ 近4週 ${i.ship4w} ｜ 前4週 ${i.shipPrev4w} ｜ 去年11–12月 ${i.shipLastNovDec} ｜ 退貨率 ${i.returnRate}<br>${i.note?`<em>${i.note}</em>`:""}</div>
 <div class="qty">${i.suggestQty}<small>建議補貨</small></div></div>`}).join("")+"</section>"}).join("");}
const skus=s=>items.filter(i=>i.style===s).map(i=>i.sku);
async function saveG(g,fp){const sk=skus(g),ts=new Date().toISOString();sk.forEach(x=>marks[x]={...(marks[x]||{}),...fp(marks[x]||{}),updatedAt:ts});render();
 try{await Promise.all(sk.map(x=>setDoc(doc(db,"restock_marks",x),marks[x],{merge:true})));toast("已儲存 "+g+"（"+sk.length+" 列）")}catch(e){toast("儲存失敗："+e.message)}}
async function save(s,p){marks[s]={...(marks[s]||{}),...p,updatedAt:new Date().toISOString()};render();
 try{await setDoc(doc(db,"restock_marks",s),marks[s],{merge:true});toast("已儲存 "+s)}catch(e){toast("儲存失敗："+e.message)}}
document.addEventListener("click",e=>{const b=e.target.closest(".bt");if(b){const g=b.dataset.g,k=b.dataset.k,v=!skus(g).every(x=>(marks[x]||{})[k]);
 const d=skus(g).map(x=>(marks[x]||{}).receivedDate).find(Boolean)||today();
 saveG(g,m=>k==="received"?{received:v,receivedDate:v?(m.receivedDate||d):""}:{[k]:v})}
 const t=e.target.closest(".tab");if(t){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));tab=t.dataset.t;render()}});
document.addEventListener("change",e=>{if(e.target.classList.contains("dt"))saveG(e.target.dataset.g,()=>({receivedDate:e.target.value}))});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toUpperCase();render()});
load().catch(e=>document.getElementById("list").innerHTML='<div class="empty">讀取失敗：'+e.message+'</div>');
</script></body></html>
