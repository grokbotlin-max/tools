<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貨物進度月曆</title>
<style>
:root{
  --bg:#f6f5f3; --card:#fff; --text:#222; --muted:#8a8a8a; --line:#e9e6e2; --soft:#f3f1ee;
  --go:#2f6fa8; --sea:#1f8a8a; --gray:#d9d7d3; --graytext:#6b6b6b; --accent:#b5564e;
  --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
.page{display:flex;flex-direction:column;height:100vh;padding:12px 14px 14px;gap:10px}
.rule{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;color:#444}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.cal-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-height:0}
.panel.list{flex:1.7}.panel.memo{flex:1}
.panel h2{margin:0 0 6px;font-size:16px}
.scroll{overflow:auto;min-height:0;flex:1}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar h1{margin:0 8px 0 0;font-size:24px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px}
.btn:hover{background:var(--soft)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.sp{flex:1}
.hint{color:var(--muted);font-size:12.5px}
.tiny{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}

.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;color:var(--muted);font-size:13px;padding-bottom:4px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:#fbfaf8}
.cell.other{background:#faf9f7}
.cell.other .dn{color:#c4c4c4}
.cell.holi{background:#f7f3fa}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dh{display:flex;align-items:center;gap:4px;min-height:22px}
.dn{font-weight:600;font-size:14px}
.cell.today .dn{background:var(--accent);color:#fff;border-radius:99px;padding:0 8px}
.mk{font-size:11.5px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.holiday{background:#fbeaea;color:#a8433a}
.mk.advice{background:#fff7de;color:#8a6a1a}
.mk.fh{background:transparent;color:#9a82b4;font-size:11px;padding:0}
.chip{font-size:16px;font-weight:600;line-height:1.3;border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--go);color:#fff;flex:none}
.chip.sea{background:var(--sea)}
.nw{display:inline-block;background:#e02424;color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px;line-height:1.5}
.chip .nw{background:#fff;color:#e02424}
.chip.gray .nw{background:#e02424;color:#fff}
.newbox{border:2px solid #e02424;background:#fff5f5;border-radius:10px;padding:7px 10px;margin-bottom:8px}
.newbox h4{margin:0 0 4px;font-size:15px;color:#c81e1e}
.newbox .r{font-size:15px;padding:2px 0}
.newbox .sp{font-size:13px;color:#4a2b2b;padding:1px 0 3px 22px}
.newbox .sc{display:inline-block;margin-right:14px}
.newbox .nl{font-size:13px;color:#1a56db;margin-left:4px}
.newbox .dn{cursor:pointer;margin-right:4px}
.newbox .nbd{margin-top:4px;font-size:12px;color:var(--muted)}
.newbox .nbd summary{cursor:pointer;font-size:12px}
.newbox .r .s{color:#7a4a4a;font-size:13px}
.chip.gray{background:var(--gray);color:var(--graytext);font-weight:500}
.chip.memo{background:#fff8dc;color:#6b5400;font-size:12.5px;font-weight:400;border:1px solid #efdf9d}
.chip.memo.done{text-decoration:line-through;opacity:.55}

.gh{width:100%;text-align:left;background:var(--soft);border:0;border-radius:8px;padding:7px 10px;display:flex;align-items:center;font-weight:600;font-size:15px;margin-top:8px}
.gh:first-child{margin-top:0}
.gh .n{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px}
.it{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:7px 6px;font-size:15px}
.it:hover{background:#faf8f6}
.it b{font-size:16px}
.it .s{color:var(--muted);font-size:13px}
.it .chk{display:block;color:var(--muted);font-size:12px}

.mform{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px}
.mform input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
.mform input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font:inherit}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line)}
.mrow input{margin-top:4px}
.mrow .t{flex:1;min-width:0;word-break:break-word}
.mrow.done .t{text-decoration:line-through;color:var(--muted)}
.mrow .d{font-size:12px;color:#6b5400;background:#fff8dc;border:1px solid #efdf9d;border-radius:99px;padding:0 7px;cursor:pointer;white-space:nowrap}
.x{border:0;background:transparent;color:#999;font-size:18px;line-height:1;padding:0 4px}
.x:hover{color:#b5564e}
.empty{color:var(--muted);padding:8px 4px;font-size:14px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 4px;font-size:20px}
.top{display:flex;align-items:flex-start;gap:8px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 10px;margin:10px 0;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.lines{margin:6px 0;padding:0;list-style:none;font-size:14px}
.lines li{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.lines li span:first-child{flex:1}
.dayitem{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.dayitem .s{margin-left:auto;color:var(--muted);font-size:13px}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;background:var(--soft);font-weight:400}
.note{background:#f6f4f1;border-radius:8px;padding:6px 10px;font-size:13px;color:#666;margin:8px 0}


/* 新品框：摺疊 */
#newbox:empty{display:none}
#newbox{flex:none;max-height:55%;overflow:auto}
.newbox{margin-bottom:0;padding:0}
.newbox .nbh{width:100%;display:flex;align-items:center;gap:6px;background:transparent;border:0;padding:9px 12px;text-align:left;font-size:15px;font-weight:700;color:#c81e1e;min-height:44px}
.newbox .nbh .ar{margin-left:auto;font-size:14px}
.newbox .nbb{padding:0 12px 10px}
.btn.cnt{background:#1f8a8a;border-color:#1f8a8a;color:#fff;font-weight:600}

/* 日期清單（手機用） */
.agenda{display:none}
.ag-day{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ag-day.today{border:2px solid var(--accent)}
.ag-h{background:var(--soft);padding:9px 14px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.ag-h .tg{background:var(--accent);color:#fff;border-radius:99px;padding:0 10px;font-size:13px;font-weight:600}
.ag-h .wk{color:var(--muted);font-weight:400;font-size:15px}
.ag-it{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 14px;border-top:1px solid var(--line);font-size:18px;font-weight:600;cursor:pointer}
.ag-it .b{margin-left:auto;font-size:14px;font-weight:400;color:var(--muted);white-space:nowrap}
.ag-it.gray{color:var(--graytext);font-weight:500;background:#faf9f7}
.ag-it.sea{color:var(--sea)}
.ag-mk{padding:6px 14px;font-size:14px;border-top:1px solid var(--line)}
.ag-mk.holiday{background:#fbeaea;color:#a8433a}.ag-mk.advice{background:#fff7de;color:#8a6a1a}.ag-mk.fh{background:#f7f3fa;color:#7d5fa0}
.ag-memo{padding:10px 14px;border-top:1px solid var(--line);background:#fff8dc;color:#6b5400;font-size:16px}
.ag-empty{color:var(--muted);padding:20px;text-align:center;font-size:16px}

/* 盤點 */
.ctop{position:sticky;top:-18px;background:#fff;z-index:3;padding:6px 0 8px;margin-top:-6px;border-bottom:1px solid var(--line)}
.cinfo{margin:8px 0;font-size:15px}
.cinfo summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:#555;font-weight:600}
.cprog{background:#eef6f6;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cprog b{font-size:20px}
.crow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.crow.unk{border-color:#e9b44c;background:#fffbf0}
.crow.bad{border-color:#e02424}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cn{font-size:21px;font-weight:700}
.ct{margin-left:auto;font-size:16px;color:#444}
.tag-unk{background:#f59e0b;color:#fff;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:700}
.cnote{font-size:13.5px;color:#7a7a7a;margin:3px 0 4px}
.cs{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.cl{flex:1 1 120px;min-width:0;font-size:17px}
.cl b{font-size:18px}.cl .ce{display:block;font-size:13px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}
.stp .sb{width:48px;height:48px;border-radius:10px;border:1px solid #bbb;background:#f3f1ee;font-size:26px;line-height:1;padding:0}
.stp .sv{width:72px;height:48px;border:1px solid #bbb;border-radius:10px;text-align:center;font-size:20px;font-weight:700;padding:0;font-family:inherit}
.stp .sv.bad,.cs .cd.bad{color:#e02424;border-color:#e02424}
.cs .cd{width:100%;text-align:right;font-size:14px;font-weight:700;color:#e02424;min-height:0}
.csum{margin-top:6px;font-size:16px;font-weight:600}
.csum.bad{color:#e02424}
.cdone{display:flex;align-items:center;gap:12px;background:#f6f4f1;border-radius:12px;padding:12px;margin:12px 0;font-size:18px;font-weight:700;min-height:56px}
.cdone input{width:30px;height:30px;flex:none}
.cdone .at{display:block;font-size:13px;color:var(--muted);font-weight:400}
.cbtn{display:block;width:100%;min-height:52px;border-radius:12px;border:1px solid #1f8a8a;background:#1f8a8a;color:#fff;font-size:18px;font-weight:700;margin:8px 0}
.cbtn.alt{background:#fff;color:#1f8a8a}
.cex{width:100%;min-height:150px;font:14px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.cwrap{margin:10px 0}.cwrap .ccard{margin:0}.cwrap.hid .ccard{opacity:.55}
.xdel{border:0;background:transparent;color:#d92d20;font-size:22px;font-weight:700;line-height:1;min-width:44px;min-height:44px;padding:0;cursor:pointer;flex:none}
.cwrap{position:relative}.cwrap .xdel{position:absolute;top:2px;right:2px}.cwrap .ccard{padding-right:52px}
.ctop .xdel{margin-right:2px}
.cdel{display:block;width:100%;min-height:48px;border:1px solid #e0b4b4;background:#fff5f5;color:#b42318;border-radius:0 0 12px 12px;font-size:16px;font-weight:700;margin-top:-1px}
.cdel.undo{border-color:#b7d7c4;background:#f0faf3;color:#1c7c3b}
.cwrap .ccard{border-radius:12px 12px 0 0}
#modal>.cdel{border-radius:12px;margin:10px 0}
.ccard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;min-height:64px}
.ccard .l1{font-size:19px;font-weight:700}
.ccard .l2{font-size:15px;color:#666;margin-top:3px}
.ccard .l2.ok{color:#1c7c3b}.ccard .l2.bad{color:#e02424}

/* 檢視模式：目前檢視 ↔ 未來 30 天 */
.vmode{display:flex;gap:6px;margin-bottom:8px}
.vmode button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:15px}
.vmode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.v30{display:none;flex:1;min-height:0;overflow:auto}
body.m30 .v30{display:block}
body.m30 .dow,body.m30 .grid,body.m30 .agenda,body.m30 #foot,body.m30 #prev,body.m30 #next,body.m30 #today{display:none!important}
.v-day{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.v-day.today{border:2px solid var(--accent)}.v-day.late{border-color:#e9b44c}
.v-h{background:var(--soft);padding:9px 14px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-h .wk{color:var(--muted);font-weight:400;font-size:15px}
.v-h .tt{margin-left:auto;font-weight:600;font-size:15px;color:#444}
.v-it{display:block;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:10px 14px;min-height:56px;cursor:pointer}
.v-it .l1{font-size:18px;font-weight:700}
.v-it .l2{font-size:14.5px;color:#666;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px}
.v-it .sub{font-size:14.5px;color:#444;margin-top:3px;line-height:1.6}
.tg-u{background:#f59e0b;color:#fff;border-radius:4px;padding:0 7px;font-size:12.5px;font-weight:700}
.tg-g{background:#e8f3ee;color:#1c7c3b;border-radius:4px;padding:0 7px;font-size:12.5px;font-weight:600}
.tg-e{background:#f3f1ee;color:#666;border-radius:4px;padding:0 7px;font-size:12.5px}

@media (max-width:1000px){
  html,body{height:auto}
  .page{height:auto}
  .app{grid-template-columns:1fr}
  .grid{grid-auto-rows:minmax(100px,auto)}
  .panel{max-height:520px}
}
@media (max-width:700px){
  html,body{font-size:16px}
  body{line-height:1.55}
  .page{padding:10px 10px 28px;gap:12px}
  .rule{font-size:15px;line-height:1.55;padding:10px 12px}
  .app{display:flex;flex-direction:column;gap:12px}
  .side{display:contents}
  #newbox{order:1;max-height:none;overflow:visible}
  .cal-wrap{order:2;padding:12px}
  .panel.list{order:3;max-height:none}
  .panel.memo{order:4;max-height:none}
  .panel{padding:12px}
  .panel h2{font-size:18px}
  .scroll{overflow:visible}
  .bar{flex-wrap:wrap;gap:8px}
  .bar h1{flex:1 1 100%;font-size:26px;margin:0}
  .bar .btn{min-height:46px;padding:8px 6px;font-size:16px;flex:1 1 auto;white-space:nowrap}
  .ag-past>summary{min-height:52px;display:flex;align-items:center;font-size:17px;font-weight:600;color:#555;cursor:pointer}
  .bar .sp,.bar .hint{display:none}
  .dow,.grid{display:none}
  .agenda{display:block;margin-top:6px}
  .hint,.tiny{font-size:14px}
  #foot{font-size:13px}
  .newbox .nbh{font-size:18px;min-height:52px}
  .newbox .r{font-size:17px;padding:8px 0;border-top:1px solid #f3d4d4}
  .newbox .r .s{font-size:15px}
  .newbox .sc{display:block;margin:0}
  .newbox .sp{font-size:16px;padding:4px 0 4px 0;line-height:1.7}
  .newbox .nl{display:inline-block;font-size:16px;padding:12px 8px;margin-left:0}
  .newbox .dn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-right:8px}
  .newbox .dn input{width:26px;height:26px}
  .newbox .nbd summary{font-size:15px;min-height:44px;display:flex;align-items:center}
  .nw{font-size:13px;padding:1px 6px}
  .gh{min-height:48px;font-size:17px;padding:10px 12px}
  .gh .n{font-size:14px}
  .it{padding:12px 8px;min-height:56px;font-size:17px;line-height:1.5}
  .it b{font-size:19px}
  .it .s{display:block;font-size:15px;margin-top:2px}
  .it .chk{font-size:14px;margin-top:2px}
  .mform{grid-template-columns:1fr;gap:10px}
  .mform input[type=text],.mform input[type=date]{font-size:16px;min-height:48px;padding:8px 10px}
  .mform .btn{min-height:48px;font-size:17px}
  .mrow{padding:10px 2px;gap:10px;align-items:center}
  .mrow input{width:26px;height:26px;margin:0}
  .mrow .t{font-size:17px}
  .mrow .d{font-size:14px;padding:4px 10px}
  .x{min-width:44px;min-height:44px;font-size:24px}
  .ov{padding:0;align-items:stretch}
  .modal{max-width:none;max-height:none;height:100%;border-radius:0;padding:14px 14px 40px;font-size:16px}
  .modal h3{font-size:22px}
  .ctop{top:-14px}
  .kv{grid-template-columns:96px 1fr;font-size:16px;gap:8px 10px}
  .lines{font-size:16px}.lines li{padding:8px 0}
  .dayitem{min-height:52px;font-size:18px}
  .note{font-size:15px;padding:10px 12px}
  .modal .btn{min-height:48px;font-size:17px}
}

</style>
</head>
<body>
<div class="page">
  <div class="rule" id="rule"></div>
  <div class="app">
    <section class="cal-wrap">
      <div class="vmode" id="vmode"><button type="button" data-vm="cur">目前檢視</button><button type="button" data-vm="30">未來 30 天</button></div>
      <div class="bar">
        <h1 id="title">貨物進度月曆</h1>
        <button class="btn" id="prev">‹ 上月</button>
        <button class="btn" id="next">下月 ›</button>
        <button class="btn prim" id="today">回到今天</button>
        <button class="btn cnt" id="cnt">盤點</button>
        <span class="sp"></span>
        <span class="hint">灰色＝已到貨</span>
      </div>
      <div class="dow"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="grid" id="grid"></div>
      <div class="agenda" id="agenda"></div>
      <div class="v30" id="v30"></div>
      <div class="hint" id="foot" style="margin-top:6px"></div>
    </section>
    <aside class="side">
      <div id="newbox"></div>
      <div class="panel list">
        <div class="scroll" id="list"></div>
      </div>
      <div class="panel memo">
        <h2>備忘錄 <span class="tiny">存在這台瀏覽器</span></h2>
        <form class="mform" id="mform">
          <input type="text" id="mtext" placeholder="寫點什麼…" maxlength="300" autocomplete="off">
          <button class="btn prim" type="submit">新增</button>
          <input type="date" id="mdate" title="綁定日期（選填，綁定後會出現在月曆上）">
          <span class="hint" style="align-self:center">綁定日期（選填）</span>
        </form>
        <div class="scroll" id="memos"></div>
      </div>
    </aside>
  </div>

<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('embedded').textContent);
var MEMO_KEY='cargo_calendar_memos_v1';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function md(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):''}
function parse(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
var TODAY=ymd(new Date());
var cur=parse(TODAY); cur=new Date(cur.getFullYear(),cur.getMonth(),1);

try{fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(d&&d.orders&&(d.generated_at||'')>(DATA.generated_at||'')){DATA=d;renderAll()}}).catch(function(){})}catch(e){}

/* 備忘錄 */
function loadMemos(){try{return JSON.parse(localStorage.getItem(MEMO_KEY)||'[]')}catch(e){return []}}
function specTxt(o){var L=o.lines||[];if(!L.length)return '查無規格';var g={},ord=[];L.forEach(function(l){var c=l.color||'（無顏色）';if(!g[c]){g[c]=[];ord.push(c)}g[c].push((l.size||'')+' '+l.qty)});return ord.map(function(c){return '<span class="sc"><b>'+esc(c)+'</b> '+g[c].map(esc).join('、')+'</span>'}).join('')}
var NEWDONE_KEY='cargo_new_done_v1';
function loadNewDone(){try{return JSON.parse(localStorage.getItem(NEWDONE_KEY)||'{}')}catch(e){return {}}}
function saveNewDone(m){try{localStorage.setItem(NEWDONE_KEY,JSON.stringify(m))}catch(e){}}
function saveMemos(m){try{localStorage.setItem(MEMO_KEY,JSON.stringify(m))}catch(e){}}
var nbOpen=false;
var memos=loadMemos();
function addMemo(text,date){text=(text||'').trim();if(!text)return;memos.push({id:'m'+Date.now()+Math.floor(Math.random()*1000),text:text,date:date||'',done:false,created:Date.now()});saveMemos(memos);renderAll()}
function delMemo(id){memos=memos.filter(function(m){return m.id!==id});saveMemos(memos);renderAll()}
function togMemo(id){memos.forEach(function(m){if(m.id===id)m.done=!m.done});saveMemos(memos);renderAll()}

/* 把訂單、海運批次整理成「每批一個項目、只出現一次」 */
function boxTxt(x){return x.boxes_show!=null?' '+x.boxes_show+'箱'+(x.boxes_mismatch?'（箱數不符）':''):''}
function boxLong(x){if(x.boxes_show==null)return '';var k=x.boxes_known||{},p=[];if(k.waybill!=null)p.push('物流單 '+k.waybill+' 箱');if(k.notice!=null)p.push('通知 '+k.notice+' 箱');if(k.received!=null)p.push('實到 '+k.received+' 箱');return p.join('、')+(x.boxes_mismatch?'　<b style="color:#b45309">箱數不符</b>':'')}
function items(){
  var out=[];
  DATA.orders.forEach(function(o){
    if(!o.cal_date||o.superseded)return;
    out.push({kind:'order',id:o.id,date:o.cal_date,text:o.style_label+' '+o.qty+'件',qty:o.qty,gray:o.group==='arrived',isNew:!!o.is_new,o:o});
  });
  (DATA.batches||[]).forEach(function(b){
    if(!b.date)return;
    out.push({kind:'batch',id:'b:'+b.id,date:b.date,text:'海運 '+b.id+' '+b.qty+'件'+boxTxt(b),qty:b.qty,gray:b.has_actual||(!b.on_the_way&&b.date<TODAY),b:b});
  });
  (DATA.wechat_shipments||[]).forEach(function(w){
    out.push({kind:'wx',id:'w:'+w.id,date:w.date,text:w.style_label+' '+w.qty+'件'+boxTxt(w),qty:w.qty,gray:false,isNew:!!w.is_new,w:w});
  });
  return out;
}
function byDay(){var m={};items().forEach(function(it){(m[it.date]=m[it.date]||[]).push(it)});return m}
function findItem(id){return items().filter(function(i){return i.id===id})[0]}

function renderRule(){document.getElementById('rule').textContent=DATA.explain||''}

function renderCal(){
  var y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('title').textContent=y+' 年 '+(m+1)+' 月';
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var last=new Date(y,m+1,0), weeks=Math.ceil((first.getDay()+last.getDate())/7);
  var grid=document.getElementById('grid');
  grid.style.gridTemplateRows='repeat('+weeks+',minmax(0,1fr))';
  var ev=byDay(), fh=DATA.marks.factory_holiday, marks={};
  DATA.marks.days.forEach(function(k){(marks[k.date]=marks[k.date]||[]).push(k)});
  var memoBy={};memos.forEach(function(mm){if(mm.date)(memoBy[mm.date]=memoBy[mm.date]||[]).push(mm)});
  var html='';
  for(var i=0;i<weeks*7;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), ds=ymd(d);
    var inFh=ds>=fh.start&&ds<=fh.end;
    html+='<div class="cell'+(d.getMonth()!==m?' other':'')+(inFh?' holi':'')+(ds===TODAY?' today':'')+'" data-day="'+ds+'"><div class="dh"><span class="dn">'+(d.getDate()===1?(d.getMonth()+1)+'/1':d.getDate())+'</span>';
    if(inFh&&(ds===fh.start||d.getDay()===0||d.getDate()===1))html+='<span class="mk fh">'+esc(fh.label)+'</span>';
    html+='</div>';
    (marks[ds]||[]).forEach(function(k){html+='<div class="mk '+k.kind+'">'+esc(k.label)+'</div>'});
    (memoBy[ds]||[]).forEach(function(mm){html+='<div class="chip memo'+(mm.done?' done':'')+'" data-day="'+ds+'">'+esc(mm.text)+'</div>'});
    var arr=ev[ds]||[];
    if(arr.length>3){
      var qt=arr.reduce(function(a,x){return a+x.qty},0), allGray=arr.every(function(x){return x.gray});
      var anyNew=arr.some(function(x){return x.isNew});
      html+='<div class="chip'+(allGray?' gray':'')+'" data-day="'+ds+'">'+(anyNew?'<span class="nw">新</span>':'')+arr.length+' 批 共 '+qt+' 件</div>';
    }else arr.forEach(function(x){
      html+='<div class="chip'+(x.gray?' gray':x.kind==='batch'?' sea':'')+'" data-item="'+esc(x.id)+'">'+(x.isNew?'<span class="nw">新品</span>':'')+esc(x.text)+'</div>';
    });
    html+='</div>';
  }
  grid.innerHTML=html;
  document.getElementById('foot').textContent='資料更新：'+(DATA.generated_at||'')+'（1688 追蹤來源 '+(DATA.source_updated_at||'')+'）。到貨日是依船運流程推算的預估。';
}

/* 手機：依日期的直向清單 */
function renderAgenda(){
  var y=cur.getFullYear(),m=cur.getMonth(),ev=byDay(),h='',n=new Date(y,m+1,0).getDate(),WK='日一二三四五六';
  var marks={};DATA.marks.days.forEach(function(k){(marks[k.date]=marks[k.date]||[]).push(k)});
  var fh=DATA.marks.factory_holiday,hp='',sameM=(TODAY.slice(0,7)===y+'-'+pad(m+1)),pastN=0;
  for(var d=1;d<=n;d++){
    var ds=y+'-'+pad(m+1)+'-'+pad(d),arr=ev[ds]||[],mm=memos.filter(function(x){return x.date===ds}),mk=marks[ds]||[];
    var inFh=ds>=fh.start&&ds<=fh.end&&(ds===fh.start||d===1);
    if(!arr.length&&!mm.length&&!mk.length&&!inFh&&ds!==TODAY)continue;
    var dayH='<div class="ag-day'+(ds===TODAY?' today':'')+'"><div class="ag-h">'+(m+1)+'/'+d+' <span class="wk">週'+WK.charAt(new Date(y,m,d).getDay())+'</span>'+(ds===TODAY?'<span class="tg">今天</span>':'')+'</div>';
    mk.forEach(function(k){dayH+='<div class="ag-mk '+esc(k.kind)+'">'+esc(k.label)+'</div>'});
    if(inFh)dayH+='<div class="ag-mk fh">'+esc(fh.label)+'（'+md(fh.start)+'–'+md(fh.end)+'）</div>';
    arr.forEach(function(x){dayH+='<div class="ag-it'+(x.gray?' gray':x.kind==='batch'?' sea':'')+'" data-item="'+esc(x.id)+'">'+(x.isNew?'<span class="nw">新品</span>':'')+'<span>'+esc(x.text)+'</span><span class="b">'+(x.gray?'已到貨':'預計到貨')+'</span></div>'});
    mm.forEach(function(x){dayH+='<div class="ag-memo" data-day="'+ds+'">'+esc(x.text)+'</div>'});
    if(!arr.length&&!mm.length&&!mk.length&&!inFh)dayH+='<div class="ag-memo" style="background:#fff;color:#888">這天沒有貨</div>';
    dayH+='</div>';
    if(sameM&&ds<TODAY){hp+=dayH;pastN++}else h+=dayH;
  }
  if(pastN)h+='<details class="ag-past"><summary>本月已過的日期（'+pastN+' 天）▸</summary>'+hp+'</details>';
  document.getElementById('agenda').innerHTML=h||'<div class="ag-empty">這個月沒有貨物或備忘</div>';
}

/* 未來 30 天 */
var VM_KEY='cargo_view_mode_v1';
var vmode=(function(){try{return localStorage.getItem(VM_KEY)==='30'?'30':'cur'}catch(e){return 'cur'}})();
function setMode(m){vmode=m;try{localStorage.setItem(VM_KEY,m)}catch(e){}renderAll()}
function render30(){
  document.body.classList.toggle('m30',vmode==='30');
  Array.prototype.forEach.call(document.querySelectorAll('#vmode button'),function(b){b.classList.toggle('on',b.getAttribute('data-vm')===vmode)});
  var box=document.getElementById('v30');if(vmode!=='30'){box.innerHTML='';return}
  var end=addDays(TODAY,29),WK='日一二三四五六';
  document.getElementById('title').textContent='未來 30 天';
  var arr=items().filter(function(x){return !x.gray&&x.date<=end}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var days={},order=[];
  arr.forEach(function(x){var k=x.date<TODAY?'late':x.date;if(!days[k]){days[k]=[];order.push(k)}days[k].push(x)});
  order.sort(function(a,b){return a==='late'?-1:b==='late'?1:a<b?-1:1});
  var h='<div class="hint" style="margin:0 0 8px">'+md(TODAY)+' – '+md(end)+'，依預計到貨日排列；沒有貨的日子已省略。</div>';
  order.forEach(function(k){
    var L=days[k],qt=L.reduce(function(s,x){return s+x.qty},0),d=k==='late'?null:parse(k);
    h+='<div class="v-day'+(k===TODAY?' today':'')+(k==='late'?' late':'')+'"><div class="v-h">'+(k==='late'?'已過預計日、還沒到':md(k)+' <span class="wk">週'+WK.charAt(d.getDay())+'</span>'+(k===TODAY?' <span class="tag-unk" style="background:var(--accent)">今天</span>':''))+'<span class="tt">'+L.length+' 批 '+qt+' 件</span></div>';
    L.forEach(function(x){
      var tags='',sub='';
      if(x.kind==='order'){var o=x.o;tags+=o.tw_expected_info?'<span class="tg-g">運單號對到 '+esc(o.tw_expected_info.batch)+'</span>':'<span class="tg-e">預估</span>';
        if(o.confirm)tags+='<span class="tg-u">請確認是否已到</span>';if(o.date&&0){}
        sub=o.group==='onroad'&&o.location&&!o.confirm?esc(o.location):''}
      else if(x.kind==='batch'){var un=(x.b.count&&x.b.count.rows||[]).filter(function(r){return !r.ok});
        tags+='<span class="tg-e">海運</span>'+(un.length?'<span class="tg-u">未確認款號 '+un.length+' 行</span>':'');
        sub=(x.b.count&&x.b.count.rows||[]).map(function(r){return (r.new?'新品 ':'')+esc(r.label)+' '+r.exp+'件'+(r.ok?'':'（未確認）')}).join('、')}

  var rec=loadCnt()[key]||{};
  x.c.rows.forEach(function(r,ri){
    var row=m.querySelector('[data-crow="'+ri+'"]');if(!row)return;var E=0,R=0;
    var css=row.querySelectorAll('.cs');
    unitsOf(r).forEach(function(u,ui){var c=css[ui],inp=c.querySelector('.sv'),v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;var d=v-u.exp;E+=u.exp;R+=v;
      inp.classList.toggle('bad',d!==0);var cd=c.querySelector('.cd');cd.textContent=d?('差 '+(d>0?'+':'')+d+' 件'):'';cd.style.display=d?'block':'none'});
    var s=row.querySelector('.csum');s.textContent='實收 '+R+' ／ 應收 '+E+(R!==E?'　差 '+(R-E>0?'+':'')+(R-E)+' 件':'　✓');s.classList.toggle('bad',R!==E);row.classList.toggle('bad',R!==E);
  });
  var sm=cntSum(key);
  document.getElementById('cprog').innerHTML='<span>實收 <b'+(sm.R!==sm.E?' style="color:#e02424"':'')+'>'+sm.R+'</b> ／ 應收 <b>'+sm.E+'</b> 件</span><span>'+(sm.diffs.length?'<span style="color:#e02424;font-weight:700">'+sm.diffs.length+' 項有差異</span>':'目前無差異')+'</span>';
  var nd=0;x.c.rows.forEach(function(r,ri){var rr=rec.rows&&rec.rows[r.key]||{},row=m.querySelector('[data-crow="'+ri+'"]');if(rr.done)nd++;
    if(row){var cb=row.querySelector('[data-cdone]');cb.checked=!!rr.done;row.querySelector('.at').textContent=rr.done?'已確認 '+rr.at:(rr.at?'上次確認 '+rr.at+'（修改後需重新確認）':'確認後會記錄盤點時間')}});
  document.getElementById('cprog').innerHTML+='<span>已確認 <b>'+nd+'</b> ／ '+x.c.rows.length+' 款</span>';
}
function setQty(key,rk,exp,val){
  var all=loadCnt(),rec=all[key]||(all[key]={r:{}});rec.r=rec.r||{};
  if(val===exp)delete rec.r[rk];else rec.r[rk]=val;
  var rkey=rk.slice(0,rk.indexOf('/'));if(rec.rows&&rec.rows[rkey]&&rec.rows[rkey].done)rec.rows[rkey].done=0;
  saveCnt(all);updCount();
}
function stepQty(btn){
  var m=document.getElementById('modal'),key=m.getAttribute('data-ck'),wrap=btn.closest('.stp'),inp=wrap.querySelector('.sv');
  var v=parseInt(inp.value,10);if(isNaN(v))v=0;v=Math.max(0,v+parseInt(btn.getAttribute('data-stp'),10));inp.value=v;
  setQty(key,inp.getAttribute('data-rk'),parseInt(inp.getAttribute('data-exp'),10),v);
}
document.addEventListener('input',function(e){var i=e.target;if(i&&i.classList&&i.classList.contains('sv')){var key=document.getElementById('modal').getAttribute('data-ck');var v=parseInt(i.value,10);if(isNaN(v)||v<0)v=0;setQty(key,i.getAttribute('data-rk'),parseInt(i.getAttribute('data-exp'),10),v)}});
document.addEventListener('change',function(e){var c=e.target;if(c&&c.getAttribute&&c.getAttribute('data-cdone')){var key=c.getAttribute('data-cdone'),rk=c.getAttribute('data-crk'),x=cntOf(key),all=loadCnt(),rec=all[key]||(all[key]={r:{}});rec.rows=rec.rows||{};
  var r=x.c.rows.filter(function(q){return q.key===rk})[0],E=0,R=0;unitsOf(r).forEach(function(u){var v=rec.r&&rec.r[u.rk]!=null?rec.r[u.rk]:u.exp;E+=u.exp;R+=v});
  if(c.checked){
    var msg='確認「'+r.label+'」盤點無誤？\n應收 '+E+' 件，實收 '+R+' 件'+(R!==E?'\n（差 '+(R-E>0?'+':'')+(R-E)+' 件）':'')+(r.ok?'':'\n※ 這行款號未確認');
    if(!window.confirm(msg)){c.checked=false;return}
    rec.rows[rk]={done:1,at:nowTxt(),iso:new Date().toISOString(),E:E,R:R};
  }else{var o=rec.rows[rk]||{};o.done=0;rec.rows[rk]=o}
  saveCnt(all);updCount()}});
function cntText(keys){
  var all=loadCnt(),L=['盤點結果（輸出時間 '+nowTxt()+'）'],any=false;
  keys.forEach(function(key){var x=cntOf(key);if(!x)return;var sm=cntSum(key);if(!sm.touched)return;any=true;var rec=sm.rec;
    L.push('');L.push('【'+x.title+'】應收 '+sm.E+'／實收 '+sm.R+(sm.R!==sm.E?'（差 '+(sm.R-sm.E>0?'+':'')+(sm.R-sm.E)+'）':'（無差異）')+'・已確認 '+sm.nd+'／'+x.c.rows.length+' 款');
    x.c.rows.forEach(function(r){var us=unitsOf(r),RE=0,EE=0;us.forEach(function(u){var v=rec.r&&rec.r[u.rk]!=null?rec.r[u.rk]:u.exp;RE+=v;EE+=u.exp});
      var rr=rec.rows&&rec.rows[r.key]||{};
      L.push(' '+r.label+(r.ok?'':'〔款號未確認〕')+' 應收 '+EE+'／實收 '+RE+(RE!==EE?'（差 '+(RE-EE>0?'+':'')+(RE-EE)+'）':'')+'・'+(rr.done?'已確認 '+rr.at:(rr.at?'未重新確認（上次 '+rr.at+'）':'未確認')));
      if(r.specs&&r.specs.length)us.forEach(function(u){var v=rec.r&&rec.r[u.rk]!=null?rec.r[u.rk]:u.exp;if(v!==u.exp)L.push('   ·'+u.s.color+' '+u.s.size+'：應收 '+u.exp+'／實收 '+v+'（差 '+(v-u.exp>0?'+':'')+(v-u.exp)+'）')});
    });
  });
  if(!any)L.push('（目前沒有任何盤點紀錄）');
  return L.join('\n');
}
function visibleCountKeys(){var h=loadHid();return allCountKeys().filter(function(k){return !h[k]})}
function allCountKeys(){var k=[];(DATA.batches||[]).forEach(function(b){k.push('b:'+b.id)});(DATA.wechat_shipments||[]).forEach(function(w){if(!w.in_batch)k.push('w:'+w.id)});return k}
function exportCount(key){
  var text=cntText(key==='all'?visibleCountKeys():[key]),ta=document.getElementById('cex');
  ta.style.display='block';ta.value=text;ta.focus();ta.select();
  var done=function(ok){var b=document.querySelector('[data-cexport="'+key+'"]');if(b){b.textContent=ok?'已複製 ✓（也可長按下方文字複製）':'請長按下方文字複製'}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(document.execCommand('copy'))});return}}catch(e){}
  try{done(document.execCommand('copy'))}catch(e){done(false)}
}
var HID_KEY='cargo_count_hidden_v1';
function loadHid(){try{return JSON.parse(localStorage.getItem(HID_KEY)||'{}')}catch(e){return {}}}
function saveHid(m){try{localStorage.setItem(HID_KEY,JSON.stringify(m))}catch(e){}}
function showCountList(){
  var hid=loadHid();
  var keys=allCountKeys().map(cntOf).filter(Boolean).filter(function(x){return !hid[x.key]}).sort(function(a,b){return (a.date||'')<(b.date||'')?1:-1});
  var h='<div class="top ctop"><div style="flex:1"><h3>盤點</h3><div class="hint" style="font-size:15px">點一批進去核對款號、顏色、件數；盤完按右上角 ✕ 刪除</div></div><button class="x" data-close="1" style="font-size:28px" aria-label="關閉">×</button></div>';
  keys.forEach(function(x){var sm=cntSum(x.key),st,cls='';
    if(sm.nd===x.c.rows.length){st='✓ 全部 '+sm.nd+' 款已確認'+(sm.diffs.length?'・'+sm.diffs.length+' 項有差異':'・無差異');cls=sm.diffs.length?' bad':' ok'}
    else if(sm.touched){st='盤點中・已確認 '+sm.nd+'／'+x.c.rows.length+' 款'+(sm.diffs.length?'・'+sm.diffs.length+' 項有差異':'');cls=sm.diffs.length?' bad':''}
    else st='尚未盤點';
    var un=x.c.rows.filter(function(r){return !r.ok}).length;
    h+='<div class="cwrap"><button class="ccard" data-count="'+esc(x.key)+'"><div class="l1">'+esc(x.title)+'　'+x.qty+' 件</div><div class="l2">'+(x.arrived?'已到貨 ':'預計到貨 ')+md(x.date)+'・'+x.c.rows.length+' 行'+(un?'（'+un+' 行未確認款號）':'')+'</div><div class="l2'+cls+'">'+st+'</div></button><button class="xdel" data-cdel="'+esc(x.key)+'" aria-label="刪除 '+esc(x.title)+' 的盤點">✕</button></div>';
  });
  if(!keys.length)h+='<div class="ag-empty">盤點清單是空的</div>';
  h+='<button class="cbtn" data-cexport="all">複製全部盤點結果</button><textarea class="cex" id="cex" readonly style="display:none"></textarea>';
  show(h);var m=document.getElementById('modal');m.removeAttribute('data-ck');m.scrollTop=0;
}
function delCount(key){var x=cntOf(key);if(!x)return;if(!window.confirm('確定刪除 '+x.title+' 的盤點？\n刪除後就不會再顯示。'))return;var hid=loadHid();hid[key]=nowTxt();saveHid(hid);showCountList()}
function showBatch(id){showCount(id)}
function showWx(id){showCount(id)}
function showItem(id){if(id.indexOf('b:')===0)showBatch(id);else if(id.indexOf('w:')===0)showWx(id);else showOrder(id)}
function showDay(ds){
  var arr=byDay()[ds]||[];
  var h='<div class="top"><div style="flex:1"><h3>'+(+ds.slice(5,7))+' 月 '+(+ds.slice(8,10))+' 日'+(ds===TODAY?'（今天）':'')+'</h3></div><button class="x" data-close="1" style="font-size:24px">×</button></div>';
  DATA.marks.days.filter(function(k){return k.date===ds}).forEach(function(k){h+='<div class="note">'+esc(k.label)+'</div>'});
  var fh=DATA.marks.factory_holiday;if(ds>=fh.start&&ds<=fh.end)h+='<div class="hint" style="margin:6px 0">'+esc(fh.label)+'：'+md(fh.start)+'–'+md(fh.end)+'</div>';
  h+='<b style="font-size:14px">貨物（'+arr.length+' 批）</b>';
  if(!arr.length)h+='<div class="empty">這天沒有貨</div>';
  arr.forEach(function(x){h+='<div class="dayitem" data-item="'+esc(x.id)+'"><span>'+esc(x.text)+'</span><span class="s">'+(x.gray?'已到貨':'預計到貨')+'</span></div>'});
  h+='<div style="margin-top:12px"><b style="font-size:14px">備忘</b></div>';
  memos.filter(function(m){return m.date===ds}).forEach(function(m){h+='<div class="mrow'+(m.done?' done':'')+'"><input type="checkbox" data-mt="'+m.id+'"'+(m.done?' checked':'')+'><div class="t">'+esc(m.text)+'</div><button class="x" data-md="'+m.id+'">×</button></div>'});
  h+='<form class="mform" data-dayform="'+ds+'" style="margin-top:6px"><input type="text" placeholder="這天要記的事…" maxlength="300"><button class="btn prim" type="submit">新增</button></form>';
  show(h);
}
function openDay(){var f=document.querySelector('[data-dayform]');return f?f.getAttribute('data-dayform'):null}

function renderAll(){renderRule();renderCal();renderAgenda();render30();renderList();renderMemos()}

document.addEventListener('click',function(e){
  var t=e.target, el;
  if(t.closest('[data-close]')||t.id==='ov'){hide();return}
  if(el=t.closest('[data-nbtoggle]')){nbOpen=!nbOpen;renderList();return}
  if(el=t.closest('[data-cdel]')){delCount(el.getAttribute('data-cdel'));return}
  if(el=t.closest('[data-count]')){showCount(el.getAttribute('data-count'));return}
  if(t.closest('[data-countlist]')){showCountList();return}
  if(el=t.closest('[data-stp]')){stepQty(el);return}
  if(el=t.closest('[data-cexport]')){exportCount(el.getAttribute('data-cexport'));return}
  if(el=t.closest('[data-md]')){var ds=openDay(),inM=document.getElementById('ov').classList.contains('on');delMemo(el.getAttribute('data-md'));if(inM&&ds)showDay(ds);return}
  if(el=t.closest('[data-mt]')){var ds2=document.getElementById('ov').classList.contains('on')?openDay():null;togMemo(el.getAttribute('data-mt'));if(ds2)showDay(ds2);return}
  if(el=t.closest('[data-jump]')){var d2=parse(el.getAttribute('data-jump'));cur=new Date(d2.getFullYear(),d2.getMonth(),1);renderAll();return}
  if(el=t.closest('[data-item]')){showItem(el.getAttribute('data-item'));return}
  if(el=t.closest('[data-oid]')){showOrder(el.getAttribute('data-oid'));return}
  if(el=t.closest('[data-day]')){showDay(el.getAttribute('data-day'));return}
});
document.addEventListener('change',function(e){var c=e.target;if(c&&c.getAttribute&&c.getAttribute('data-done')){var m=loadNewDone(),st=c.getAttribute('data-done'),d=document.querySelector('#newbox details.nbd'),op=d&&d.open;if(c.checked)m[st]=1;else delete m[st];saveNewDone(m);renderList();var d2=document.querySelector('#newbox details.nbd');if(d2&&op)d2.open=true}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
document.getElementById('prev').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderAll()};
document.getElementById('next').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderAll()};
Array.prototype.forEach.call(document.querySelectorAll('#vmode button'),function(b){b.onclick=function(){setMode(b.getAttribute('data-vm'))}});
document.getElementById('cnt').onclick=function(){showCountList()};
document.getElementById('today').onclick=function(){TODAY=ymd(new Date());var d=parse(TODAY);cur=new Date(d.getFullYear(),d.getMonth(),1);renderAll()};
document.getElementById('mform').addEventListener('submit',function(e){e.preventDefault();var t=document.getElementById('mtext'),d=document.getElementById('mdate');addMemo(t.value,d.value);t.value='';d.value=''});
document.addEventListener('submit',function(e){var f=e.target;if(f.hasAttribute&&f.hasAttribute('data-dayform')){e.preventDefault();var ds=f.getAttribute('data-dayform');addMemo(f.querySelector('input').value,ds);showDay(ds)}});
renderAll();
})();
</script>
