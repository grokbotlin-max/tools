<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貨物進度月曆</title>
<style>
:root{
  --bg:#f6f5f3; --card:#fff; --text:#222; --muted:#7a7a7a; --line:#e6e3df; --soft:#f1efec;
  --c-order:#3b82f6; --c-ship:#8b5cf6; --c-gz:#0d9488; --c-tw_ship:#d97706; --c-tw_arrive:#ea580c; --c-a1:#16a34a;
  --accent:#b5564e;
  --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;height:100vh;padding:14px}
.cal-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.side{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-height:0}
.panel.list{flex:1.7}.panel.memo{flex:1}
.panel h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12px}
.scroll{overflow:auto;min-height:0;flex:1}

/* toolbar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{margin:0 6px 0 0;font-size:22px;letter-spacing:.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;color:var(--text)}
.btn:hover{background:var(--soft)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.sp{flex:1}
.search{border:1px solid var(--line);border-radius:8px;padding:5px 10px;width:150px;font:inherit}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px 2px 6px;font-size:12px;color:var(--text)}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.lg.off{opacity:.35;text-decoration:line-through}
.lg.est i{background:#fff;border:1.5px dashed var(--c)}
.hint{color:var(--muted);font-size:12px}

/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;color:var(--muted);font-size:12px;padding-bottom:4px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative}
.cell:hover{background:#fbfaf8}
.cell.other{background:#faf9f7}
.cell.other .dn{color:#bbb}
.cell.holi{background:repeating-linear-gradient(135deg,#f3eef8 0 8px,#f8f5fb 8px 16px)}
.cell.holi.other{background:repeating-linear-gradient(135deg,#f6f3f9 0 8px,#faf8fc 8px 16px)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dh{display:flex;align-items:center;gap:4px;min-height:20px}
.dn{font-weight:600;font-size:13px}
.cell.today .dn{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px}
.mk{font-size:11px;line-height:1.25;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.holiday{background:#fde8e8;color:#b42318;font-weight:600}
.mk.advice{background:#fff4d6;color:#8a5a00;border:1px solid #f3d98b}
.mk.fh{background:transparent;color:#7e57a8;font-size:10.5px}
.chip{font-size:11.5px;line-height:1.3;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid var(--c);background:var(--c);color:#fff;cursor:pointer;flex:none}
.chip.est{background:#fff;color:var(--c);border-style:dashed}
.chip.approx{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);border-style:solid}
.chip.od{box-shadow:0 0 0 1px #dc2626 inset}
.chip.memo{--c:#b08900;background:#fff8dc;color:#6b5400;border:1px solid #ecd78a}
.chip.memo.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);padding:0 4px;flex:none}

/* list */
.grp{margin-bottom:8px}
.grp>button.gh{width:100%;text-align:left;background:var(--soft);border:0;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.grp>button.gh .n{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.grp>button.gh i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.it{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:6px 6px 6px 10px;margin:0}
.it:hover{background:#faf8f6}
.it b{font-size:14px}
.it .s{color:var(--muted);font-size:12px}
.it .q{float:right;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;background:#fde8e8;color:#b42318;margin-left:4px}
.tag.g{background:#eef2f7;color:#475569}

/* memo */
.mform{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px}
.mform input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;min-width:0}
.mform input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font:inherit}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line)}
.mrow input{margin-top:3px}
.mrow .t{flex:1;min-width:0;word-break:break-word}
.mrow.done .t{text-decoration:line-through;color:var(--muted)}
.mrow .d{font-size:11px;color:#6b5400;background:#fff8dc;border:1px solid #ecd78a;border-radius:99px;padding:0 6px;cursor:pointer;white-space:nowrap}
.x{border:0;background:transparent;color:#999;font-size:16px;line-height:1;padding:0 4px}
.x:hover{color:#dc2626}
.empty{color:var(--muted);padding:10px 4px;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .top{display:flex;align-items:flex-start;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:10px 0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.tl{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tl li{border:1.5px solid var(--c);border-radius:8px;padding:5px 8px;font-size:12.5px;background:color-mix(in srgb,var(--c) 10%,#fff)}
.tl li.est{border-style:dashed;background:#fff}
.tl li.none{border-color:var(--line);border-style:dotted;color:#aaa;background:#fff}
.tl li b{display:block;color:var(--c)}
.tl li.none b{color:#aaa}
.lines{margin:6px 0;padding:0;list-style:none;font-size:13px}
.lines li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.lines li span:first-child{flex:1}
.warn{background:#fff4d6;border:1px solid #f3d98b;color:#7a5200;border-radius:8px;padding:6px 10px;font-size:12.5px;margin:6px 0}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;background:var(--soft)}
.dayitem{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dayitem i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.dayitem.est i{background:#fff;border:1.5px dashed var(--c)}

@media (max-width:1000px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .cal-wrap{height:auto}
  .grid{grid-auto-rows:minmax(92px,auto)}
  .side{min-height:0}
  .panel{max-height:520px}
}
</style>
</head>

<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('embedded').textContent);
var STAGES=['order','ship','gz','tw_ship','tw_arrive','a1'];
var SL={order:'下單',ship:'賣家發貨',gz:'到廣州倉',tw_ship:'寄往台灣',tw_arrive:'到台灣',a1:'入A1'};
var STATES=['unshipped','shipping','arrived_gz','a1'];
var STL={unshipped:'未發貨',shipping:'運送中',arrived_gz:'已到廣州待入 A1',a1:'已入 A1'};
var STC={unshipped:'var(--c-order)',shipping:'var(--c-ship)',arrived_gz:'var(--c-gz)',a1:'var(--c-a1)'};
var MEMO_KEY='cargo_calendar_memos_v1';
var hidden={}, q='', openGrp={unshipped:true,shipping:true,arrived_gz:true,a1:false};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function md(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):''}
function parse(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))}
var realToday=ymd(new Date());
var TODAY=realToday;
var cur=parse(TODAY); cur=new Date(cur.getFullYear(),cur.getMonth(),1);

/* 資料：嵌入的為底，同資料夾 data.json 若更新就換上 */
function setData(d){DATA=d;renderAll()}
try{
  fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(d&&d.orders&&(d.generated_at||'')>(DATA.generated_at||'')) setData(d);
  }).catch(function(){});
}catch(e){}

/* 備忘錄 */
function loadMemos(){try{return JSON.parse(localStorage.getItem(MEMO_KEY)||'[]')}catch(e){return []}}
function saveMemos(m){try{localStorage.setItem(MEMO_KEY,JSON.stringify(m))}catch(e){}}
var memos=loadMemos();
function addMemo(text,date){text=(text||'').trim();if(!text)return;memos.push({id:'m'+Date.now()+Math.floor(Math.random()*1000),text:text,date:date||'',done:false,created:Date.now()});saveMemos(memos);renderAll()}
function delMemo(id){memos=memos.filter(function(m){return m.id!==id});saveMemos(memos);renderAll()}
function togMemo(id){memos.forEach(function(m){if(m.id===id)m.done=!m.done});saveMemos(memos);renderAll()}

function orderById(id){return DATA.orders.filter(function(o){return o.id===id})[0]}
function matchQ(o){
  if(!q)return true;
  var s=(o.style+' '+(o.order_no||'')+' '+(o.name||'')+' '+(o.factory_code||'')+' '+(o.tracking_no||'')).toLowerCase();
  return s.indexOf(q)>=0;
}
function chipText(ev){
  var o=ev.o, sty=o.style==='待確認'?'款號待確認':o.style;
  return SL[ev.stage]+' '+sty+' '+o.qty+(ev.kind==='est'?'（估）':'');
}
function collect(){
  var by={};
  DATA.orders.forEach(function(o){
    if(!matchQ(o))return;
    STAGES.forEach(function(s){
      var st=o.stages[s]; if(!st||!st.date||hidden[s])return;
      (by[st.date]=by[st.date]||[]).push({stage:s,o:o,kind:st.kind,od:!!st.overdue,date:st.date});
    });
  });
  return by;
}

/* 月曆 */
function renderCal(){
  var y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('title').textContent=y+' 年 '+(m+1)+' 月';
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var last=new Date(y,m+1,0), weeks=Math.ceil((first.getDay()+last.getDate())/7);
  var grid=document.getElementById('grid');
  grid.style.gridTemplateRows='repeat('+weeks+',minmax(0,1fr))';
  var ev=collect(), fh=DATA.marks.factory_holiday, marks={};
  DATA.marks.days.forEach(function(k){(marks[k.date]=marks[k.date]||[]).push(k)});
  var memoBy={};memos.forEach(function(mm){if(mm.date)(memoBy[mm.date]=memoBy[mm.date]||[]).push(mm)});
  var html='';
  for(var i=0;i<weeks*7;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), ds=ymd(d);
    var inFh=ds>=fh.start&&ds<=fh.end;
    var cls='cell'+(d.getMonth()!==m?' other':'')+(inFh?' holi':'')+(ds===TODAY?' today':'');
    html+='<div class="'+cls+'" data-day="'+ds+'"><div class="dh"><span class="dn">'+(d.getDate()===1?(d.getMonth()+1)+'/1':d.getDate())+'</span>';
    if(inFh&&(ds===fh.start||d.getDay()===0||d.getDate()===1))html+='<span class="mk fh">'+esc(fh.label)+'</span>';
    html+='</div>';
    (marks[ds]||[]).forEach(function(k){html+='<div class="mk '+k.kind+'" title="'+esc(k.label)+'">'+esc(k.label)+'</div>'});
    var items=[];
    (memoBy[ds]||[]).forEach(function(mm){items.push('<div class="chip memo'+(mm.done?' done':'')+'" data-day="'+ds+'" title="'+esc(mm.text)+'">備忘 '+esc(mm.text)+'</div>')});
    // 同日同階段超過 2 筆 → 合併成一個
    var g={};(ev[ds]||[]).forEach(function(e){var k=e.stage+'|'+(e.kind==='est'?'e':e.kind==='approx'?'a':'x');(g[k]=g[k]||[]).push(e)});
    STAGES.forEach(function(s){['x','a','e'].forEach(function(t){
      var arr=g[s+'|'+t];if(!arr)return;
      var kind=t==='e'?'est':t==='a'?'approx':'actual';
      if(arr.length<=2){arr.forEach(function(e){items.push('<div class="chip '+(kind==='est'?'est':kind==='approx'?'approx':'')+(e.od?' od':'')+'" style="--c:var(--c-'+s+')" data-oid="'+esc(e.o.id)+'" data-day="'+ds+'" title="'+esc(chipText(e)+(e.od?'（已逾預估）':''))+'">'+esc(chipText(e))+'</div>')});}
      else{var qt=arr.reduce(function(a,e){return a+e.o.qty},0);
        items.push('<div class="chip '+(kind==='est'?'est':kind==='approx'?'approx':'')+(arr.some(function(e){return e.od})?' od':'')+'" style="--c:var(--c-'+s+')" data-day="'+ds+'" title="'+esc(SL[s]+' '+arr.length+' 筆（點開看明細）')+'">'+esc(SL[s]+' '+arr.length+' 筆 '+qt+(kind==='est'?'（估）':''))+'</div>')}
    })});
    var cap=weeks>=6?3:4;
    html+=items.slice(0,cap).join('');
    if(items.length>cap)html+='<div class="more" data-day="'+ds+'">還有 '+(items.length-cap)+' 項…</div>';
    html+='</div>';
  }
  grid.innerHTML=html;
}
function renderLegend(){
  var h='';
  STAGES.forEach(function(s){h+='<button class="lg'+(hidden[s]?' off':'')+'" style="--c:var(--c-'+s+')" data-stage="'+s+'" title="點一下顯示／隱藏"><i></i>'+SL[s]+'</button>'});
  h+='<span class="lg est" style="--c:#555"><i></i>虛線＝預估日期</span>';
  document.getElementById('legend').innerHTML=h;
  var c=DATA.counts||{};
  document.getElementById('foot').textContent='資料更新：'+(DATA.generated_at||'')+'（1688 追蹤來源 '+(DATA.source_updated_at||'')+'）。寄往台灣／到台灣目前來源沒有資料，皆為預估。紅框＝已逾預估日。';
}

/* 進度清單 */
function keyDate(o){
  var order=o.state==='a1'?['a1','gz','order']:o.state==='arrived_gz'?['a1','gz']:o.state==='shipping'?['gz','tw_arrive','a1']:['ship','gz'];
  for(var i=0;i<order.length;i++){var s=o.stages[order[i]];if(s&&s.date)return {s:order[i],d:s}}
  return null;
}
function renderList(){
  var h='',tot=0,totq=0;
  STATES.forEach(function(st){
    var arr=DATA.orders.filter(function(o){return o.state===st&&matchQ(o)});
    arr.sort(function(a,b){var ka=keyDate(a),kb=keyDate(b);var da=ka?ka.d.date:'',db=kb?kb.d.date:'';return st==='a1'?(db>da?1:db<da?-1:0):(da>db?1:da<db?-1:0)});
    var qty=arr.reduce(function(a,o){return a+o.qty},0);
    tot+=arr.length;totq+=qty;
    h+='<div class="grp" style="--c:'+STC[st]+'"><button class="gh" data-grp="'+st+'"><i></i>'+STL[st]+'<span class="n">'+arr.length+' 筆・'+qty+' 件 '+(openGrp[st]?'▾':'▸')+'</span></button>';
    if(openGrp[st]){
      if(!arr.length)h+='<div class="empty">目前沒有</div>';
      arr.forEach(function(o){
        var k=keyDate(o),line='';
        if(k){line=SL[k.s]+' '+md(k.d.date)+(k.d.kind==='est'?'（預估）':k.d.kind==='approx'?'（最遲）':'')}
        else line='下單 '+md(o.dates.order);
        h+='<button class="it" data-oid="'+esc(o.id)+'"><span class="q">'+o.qty+' 件</span><b>'+esc(o.style==='待確認'?'款號待確認':o.style)+'</b> <span class="s">'+esc(o.source==='微信'?'微信 '+(o.factory_code||''):'1688')+'</span>'+(o.overdue?'<span class="tag">逾預估</span>':'')+'<br><span class="s">'+esc(o.name||'')+'</span><br><span class="s">'+esc(line)+'</span></button>';
      });
    }
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('listsum').textContent='共 '+tot+' 筆・'+totq+' 件';
}

/* 備忘錄 */
function renderMemos(){
  var arr=memos.slice().sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;var da=a.date||'9999',db=b.date||'9999';return da<db?-1:da>db?1:a.created-b.created});
  var h=arr.length?'':'<div class="empty">還沒有備忘。上面輸入後按「新增」；選了日期，就會出現在月曆那一天。</div>';
  arr.forEach(function(m){
    h+='<div class="mrow'+(m.done?' done':'')+'"><input type="checkbox" data-mt="'+m.id+'"'+(m.done?' checked':'')+'><div class="t">'+esc(m.text)+'</div>'+(m.date?'<span class="d" data-jump="'+m.date+'">'+md(m.date)+'</span>':'')+'<button class="x" data-md="'+m.id+'" title="刪除">×</button></div>';
  });
  document.getElementById('memos').innerHTML=h;
}

/* Modal */
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('ov').classList.add('on')}
function hide(){document.getElementById('ov').classList.remove('on')}
function fmtStage(s){
  if(!s)return null;
  return md(s.date)+(s.kind==='est'?'（預估）':s.kind==='approx'?'（最遲）':'')+(s.overdue?' 逾期':'');
}
function showOrder(id){
  var o=orderById(id);if(!o)return;
  var h='<div class="top"><div style="flex:1"><h3>'+esc(o.style==='待確認'?'款號待確認':o.style)+' <span class="badge">'+esc(o.state_label)+'</span></h3><div class="hint">'+esc(o.name||o.title||'')+'</div></div><button class="x" data-close="1" style="font-size:22px">×</button></div>';
  if(o.overdue)h+='<div class="warn">有階段已超過預估日，月曆上以「逾期」排在今天附近，請確認實際進度。</div>';
  h+='<ul class="tl">';
  STAGES.forEach(function(s){var st=o.stages[s];
    h+='<li style="--c:var(--c-'+s+')" class="'+(st?(st.kind==='est'?'est':''):'none')+'"><b>'+SL[s]+'</b>'+(st?esc(fmtStage(st)):'來源未記錄')+'</li>';
  });
  h+='</ul><dl class="kv">';
  h+='<dt>目前階段</dt><dd>'+esc(o.state_label)+'</dd>';
  h+='<dt>款號</dt><dd>'+esc(o.style)+'</dd>';
  if(o.name)h+='<dt>品名</dt><dd>'+esc(o.name)+'</dd>';
  if(o.title)h+='<dt>1688 商品</dt><dd>'+esc(o.title)+'</dd>';
  if(o.source==='微信')h+='<dt>微信廠商料號</dt><dd>'+esc(o.factory_code||'（未記錄）')+'</dd>';
  else{
    h+='<dt>1688 訂單編號</dt><dd>'+esc(o.order_no||'')+'</dd>';
    if(o.seller)h+='<dt>賣家</dt><dd>'+esc(o.seller)+'</dd>';
    if(o.url)h+='<dt>商品頁</dt><dd><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.url)+'</a></dd>';
  }
  h+='<dt>物流</dt><dd>'+(o.tracking_no?esc((o.carrier?o.carrier+'　':'')+o.tracking_no):'<span style="color:#aaa">尚無物流單號</span>')+'</dd>';
  if(o.latest_tracking)h+='<dt>最新軌跡</dt><dd>'+esc(o.latest_tracking)+'</dd>';
  h+='<dt>總件數</dt><dd>'+o.qty+' 件</dd>';
  if(o.a1_docs&&o.a1_docs.length)h+='<dt>A1 進貨單</dt><dd>'+o.a1_docs.map(function(d){return esc(d.doc)+'（'+md(d.date)+'・'+d.qty+' 件'+(d.po?'・採購單 '+esc(d.po):'')+(d.skus?'：'+esc(Object.keys(d.skus).map(function(k){return k+' '+d.skus[k]}).join('、')):'')+'）'}).join('<br>')+'</dd>';
  (o.notes||[]).forEach(function(n){h+='<dt>備註</dt><dd>'+esc(n)+'</dd>'});
  h+='</dl><b style="font-size:13px">顏色／尺寸／件數</b><ul class="lines">';
  o.lines.forEach(function(l){h+='<li><span>'+esc(l.color)+' ／ '+esc(l.size)+(l.sku?' <span class="hint">'+esc(l.sku)+'</span>':'')+'</span><span>'+l.qty+' 件</span>'+(o.lines.some(function(x){return x.state!==o.state})?'<span class="hint">'+esc(STL[l.state])+'</span>':'')+'</li>'});
  h+='</ul>';
  if(o.missing&&o.missing.length)h+='<div class="hint" style="margin-top:8px">資料缺：'+esc(o.missing.join('、'))+'</div>';
  var k=keyDate(o);
  h+='<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-goto="'+esc(o.id)+'">在月曆上看</button><button class="btn" data-close="1">關閉</button></div>';
  show(h);
}
function showDay(ds){
  var ev=collect()[ds]||[];
  var h='<div class="top"><div style="flex:1"><h3>'+(+ds.slice(5,7))+' 月 '+(+ds.slice(8,10))+' 日'+(ds===TODAY?'（今天）':'')+'</h3></div><button class="x" data-close="1" style="font-size:22px">×</button></div>';
  DATA.marks.days.filter(function(k){return k.date===ds}).forEach(function(k){h+='<div class="warn">'+esc(k.label)+'</div>'});
  var fh=DATA.marks.factory_holiday;if(ds>=fh.start&&ds<=fh.end)h+='<div class="hint" style="margin:6px 0">'+esc(fh.label)+'：'+md(fh.start)+'–'+md(fh.end)+'</div>';
  var ms=memos.filter(function(m){return m.date===ds});
  h+='<b style="font-size:13px">備忘</b>';
  ms.forEach(function(m){h+='<div class="mrow'+(m.done?' done':'')+'"><input type="checkbox" data-mt="'+m.id+'"'+(m.done?' checked':'')+'><div class="t">'+esc(m.text)+'</div><button class="x" data-md="'+m.id+'">×</button></div>'});
  h+='<form class="mform" data-dayform="'+ds+'" style="margin-top:6px"><input type="text" placeholder="這天要記的事…" maxlength="300"><button class="btn prim" type="submit">新增</button></form>';
  h+='<b style="font-size:13px">貨物進度（'+ev.length+'）</b>';
  if(!ev.length)h+='<div class="empty">這天沒有貨物節點</div>';
  STAGES.forEach(function(s){ev.filter(function(e){return e.stage===s}).forEach(function(e){
    h+='<div class="dayitem'+(e.kind==='est'?' est':'')+'" style="--c:var(--c-'+s+')" data-oid="'+esc(e.o.id)+'"><i></i><span style="flex:1">'+esc(chipText(e))+(e.od?'<span class="tag">逾預估</span>':'')+'</span><span class="hint">'+esc(e.o.name||'')+'</span></div>';
  })});
  show(h);
}

function renderAll(){renderLegend();renderCal();renderList();renderMemos()}

/* 事件 */
document.addEventListener('click',function(e){
  var t=e.target, el;
  if(el=t.closest('[data-close]')){hide();return}
  if(t.id==='ov'){hide();return}
  if(el=t.closest('[data-goto]')){var o=orderById(el.getAttribute('data-goto'));var k=o&&keyDate(o);if(k){var d=parse(k.d.date);cur=new Date(d.getFullYear(),d.getMonth(),1)}hide();renderAll();return}
  if(el=t.closest('[data-stage]')){var s=el.getAttribute('data-stage');hidden[s]=!hidden[s];renderAll();return}
  if(el=t.closest('[data-grp]')){var g=el.getAttribute('data-grp');openGrp[g]=!openGrp[g];renderList();return}
  if(el=t.closest('[data-md]')){delMemo(el.getAttribute('data-md'));return}
  if(el=t.closest('[data-mt]')){var id=el.getAttribute('data-mt');var dm=document.getElementById('modal').contains(el);var ds=dm?(document.querySelector('[data-dayform]')||{}).getAttribute&&document.querySelector('[data-dayform]').getAttribute('data-dayform'):null;togMemo(id);if(ds)showDay(ds);return}
  if(el=t.closest('[data-jump]')){var d2=parse(el.getAttribute('data-jump'));cur=new Date(d2.getFullYear(),d2.getMonth(),1);renderAll();return}
  if(el=t.closest('[data-oid]')){showOrder(el.getAttribute('data-oid'));return}
  if(el=t.closest('[data-day]')){showDay(el.getAttribute('data-day'));return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
document.getElementById('prev').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderAll()};
document.getElementById('next').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderAll()};
document.getElementById('today').onclick=function(){TODAY=ymd(new Date());var d=parse(TODAY);cur=new Date(d.getFullYear(),d.getMonth(),1);renderAll()};
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();renderAll()});
document.getElementById('mform').addEventListener('submit',function(e){e.preventDefault();var t=document.getElementById('mtext'),d=document.getElementById('mdate');addMemo(t.value,d.value);t.value='';d.value=''});
document.addEventListener('submit',function(e){var f=e.target;if(f.hasAttribute&&f.hasAttribute('data-dayform')){e.preventDefault();var ds=f.getAttribute('data-dayform');addMemo(f.querySelector('input').value,ds);showDay(ds)}});

/* 以今天的真實日期為準；若資料產生日較新（例如離線檢視舊檔）仍用真實今天 */
renderAll();
})();
</script>
